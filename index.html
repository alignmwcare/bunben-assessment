<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>初期アセスメント</title>
<style>
:root{
  --paper:#F5F3EF;
  --glass:rgba(253,249,244,.68);
  --glass2:rgba(253,249,244,.48);
  --glass3:rgba(253,249,244,.78);
  --hair:rgba(20,16,12,.09);
  --edge:rgba(140,106,74,.30);
  --rule:rgba(20,16,12,.16);
  --ink:#18140F;
  --muted:#736C63;
  --faint:#A79E92;
  --accent:#8C6A4A;
  --accent2:#6E5138;
  --accentBg:rgba(140,106,74,.12);
  --maternal:#C0392B;
  --fetal:#2F6690;
  --report:#B5651D;
  --watch:#A98420;
  --ok:#3F7D53;
  --jp:"Meiryo","メイリオ","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  --mono:"Meiryo","メイリオ","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px; --r-pill:999px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--jp);color:var(--ink);font-size:16px;line-height:1.7;letter-spacing:.015em;
  padding-bottom:11rem;-webkit-font-smoothing:antialiased;
  background:#F3F1EC;
}
/* 背景のにじみ。iOS Safariは background-attachment:fixed を正しく扱えず
   （拡大・スクロール追従の破綻・backdrop-filterとの競合）表示が崩れるため、
   固定配置の疑似要素で同じ見た目を作る。 */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(90% 65% at 8% -8%, rgba(196,168,132,.24) 0%, transparent 68%),
    radial-gradient(80% 60% at 104% 4%, rgba(140,168,186,.20) 0%, transparent 68%),
    radial-gradient(95% 65% at 46% 108%, rgba(186,164,176,.18) 0%, transparent 70%),
    linear-gradient(180deg,#FBFAF7 0%, #F3F1EC 55%, #EFEDE7 100%);
}
svg{display:inline-block;vertical-align:-.15em;flex:0 0 auto;max-width:100%;height:auto}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---------- ヘッダー ---------- */
header{padding:18px 0 4px}
.hrow{display:flex;align-items:baseline;gap:14px}
h1{font-size:20px;font-weight:700;letter-spacing:.06em;margin:0}
.sub{font-size:12px;color:var(--muted);line-height:1.6;margin-top:4px;letter-spacing:.01em}
.guidebtn{font-family:var(--jp);font-size:12px;font-weight:600;color:var(--muted);
  background:var(--glass2);border:none;border-radius:999px;padding:6px 12px;
  cursor:pointer;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8);white-space:nowrap}
.hactions{display:none;margin-left:auto;gap:6px}
.gdlist{display:flex;flex-direction:column;gap:9px}
.gdrow{display:flex;align-items:baseline;gap:12px;font-size:13.5px;line-height:1.7}
.gdrow .gdk{flex:0 0 9.5em;font-weight:700;color:var(--ink)}
.gdrow .gdv{color:var(--muted)}
@media(max-width:400px){.gdrow{flex-direction:column;gap:2px}.gdrow .gdk{flex:none}}
.hactions button.ib{font-size:12.5px;padding:7px 13px;border:none;border-radius:var(--r-pill);
  background:var(--glass2);color:var(--ink);cursor:pointer;font-weight:600;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8);display:inline-flex;align-items:center;gap:5px}
.hactions .em{font-size:13px;filter:saturate(.85)}
.hactions button.emoji-only{width:34px;height:34px;padding:0;justify-content:center;border-radius:50%}
.hactions button.emoji-only .em{font-size:16px}

.screen{display:none}
.screen.on{display:block}

/* ---------- 汎用：ガラスの面 ---------- */
.glass{background:var(--glass);border:.5px solid var(--edge);border-radius:var(--r-lg);
  box-shadow:0 12px 32px rgba(90,74,56,.08), 0 1px 2px rgba(90,74,56,.04)}
.glass-in{background:var(--glass2);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.7)}

/* ---------- 節（見出し＋カード） ---------- */
.sec{margin:0 0 22px}
.sec:last-of-type{margin-bottom:16px}
.sech{display:flex;align-items:baseline;gap:9px;font-size:17px;font-weight:700;
  letter-spacing:.02em;color:var(--ink);margin:0 0 12px;padding:0 2px 0 12px;position:relative;
  flex-wrap:wrap}
/* 見出しの語そのものは折り返さない。「共通ケ／ア」のように割れるのを防ぐ */
.sech>:first-child,.sech{white-space:nowrap}
.sech .sm,.sech .foldwhat{white-space:normal}
.sech .foldwhat{flex-basis:100%;margin-top:2px}
.sech::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:3px;
  border-radius:2px;background:var(--accent)}
.chkng{background:var(--warnbg,#fdf3f2);border:1px solid var(--danger,#b3261e);border-radius:10px;
  padding:10px 12px;margin:0 0 12px;font-size:12.5px;line-height:1.7;color:var(--ink)}
.rfhit{font-weight:600}
.rfmore{margin-top:4px}
.rfmore>summary{cursor:pointer;font-size:11.5px;color:var(--muted);letter-spacing:.02em;list-style:none}
.rfmore>summary::-webkit-details-marker{display:none}
.rfmore>summary::before{content:'▸ ';font-size:10px}
.rfmore[open]>summary::before{content:'▾ '}
.rfrest{color:var(--muted)}
.fn2{color:var(--muted);font-size:11px}
.chkok{font-size:11.5px;letter-spacing:.02em;color:var(--muted);margin:0 0 10px}
.chkok::before{content:'✓ '}
.chkna{font-size:11.5px;letter-spacing:.02em;color:var(--danger,#b3261e);margin:0 0 10px}
.chkngh{font-weight:700;margin-bottom:2px}
.chkng ul{margin:6px 0;padding-left:18px}
.chkng li{margin:2px 0}
.fwarn{display:none;font-size:11px;letter-spacing:.02em;color:var(--danger,#b3261e);margin-top:3px}
.fwarn.on{display:block}
.f input.bad{border-color:var(--danger,#b3261e)}
.row[class*="tgr"]{grid-template-columns:1fr;max-width:430px;gap:0}
.row[class*="tgr"]+.row[class*="tgr"]{margin-top:0}
.f.tgf{display:flex!important;flex-direction:row!important;flex-wrap:nowrap;
  align-items:center;justify-content:space-between;gap:14px;
  padding:9px 0;border-bottom:1px solid var(--line)}
.row[class*="tgr"]:last-of-type .f.tgf{border-bottom:0}
.f.tgf>label{font-size:13px;color:var(--ink);flex:1 1 auto;min-width:0}
.f.tgf>.yn{flex:0 0 auto;margin-left:0}
.sech .sm{margin-left:auto;font-size:12px;font-weight:400;letter-spacing:.03em;color:var(--muted)}

/* 折りたためる節：summaryが見出し（カードの外）。開けることが分かる帯にする */
details.seco{display:block}
details.seco>.sech{cursor:pointer;list-style:none;position:relative;
  padding:12px 40px 12px 16px;margin-bottom:0;border-radius:var(--r-md);
  background:var(--glass2);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8)}
details.seco>.sech::before{display:none}
details.seco>.sech::-webkit-details-marker{display:none}
details.seco>.sech::after{content:'';position:absolute;right:16px;top:50%;width:9px;height:9px;
  margin-top:-7px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);
  transform:rotate(45deg);transition:transform .18s}
details.seco[open]>.sech::after{transform:rotate(-135deg);margin-top:-4px}
details.seco[open]>.sech{border-radius:var(--r-md) var(--r-md) 0 0;box-shadow:none;
  background:var(--accentBg)}
details.seco:not([open])>.sech:active{background:var(--glass3)}
details.seco[open]>.card{border-top-left-radius:0;border-top-right-radius:0;
  border-top:none;margin-top:0}
details.seco:not([open]){margin-bottom:14px}
details.seco[open]{margin-bottom:22px}

/* ---------- カード ---------- */
.card{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r-lg);
  padding:22px 20px 24px;margin:0;
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 12px 32px rgba(90,74,56,.10), 0 1px 2px rgba(90,74,56,.05)}
@media(max-width:400px){.card{padding:19px 16px 21px}}

/* ---------- ID／日時：帯として目立たせる ---------- */
.idbar{padding:12px 16px;margin:0 0 16px;display:flex;align-items:center;gap:22px;
  background:var(--glass);border:1px solid var(--edge);border-radius:var(--r-md);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 6px 18px rgba(90,74,56,.08)}
.idfld{display:flex;flex-direction:column;gap:1px;min-width:0}
.idfld:last-child{margin-left:auto}
.idlbl{font-size:9.5px;letter-spacing:.1em;color:var(--faint)}
.idval{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idval.mono{font-family:var(--mono);font-size:13.5px;color:var(--accent2)}

/* ---------- いまカード ---------- */
.gbadge{margin-left:auto;display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-size:11px;font-weight:700;letter-spacing:.05em;padding:6px 13px;border-radius:var(--r-pill)}
.gbadge svg{width:12px;height:12px;stroke-width:2.2}
.gbadge.ok{color:var(--ok);background:rgba(63,125,83,.10)}
.gbadge.warn{color:#95530C;background:rgba(181,101,29,.14)}

.metaline{font-size:14px;color:var(--muted);letter-spacing:.02em;margin-bottom:5px}
.phrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.phline{font-size:27px;font-weight:700;letter-spacing:.02em;line-height:1.35;margin:2px 0 0}
.phsub{display:inline-block;font-size:12px;font-weight:600;color:var(--accent2);
  letter-spacing:.06em;background:var(--accentBg);border-radius:var(--r-pill);
  padding:3px 11px;margin-left:auto;align-self:center}
.phhr{height:3px;margin:10px 0 13px;width:100%;border-radius:2px;
  background:linear-gradient(90deg, var(--accent) 0%, rgba(140,106,74,.35) 55%, transparent 100%)}
.fn{font-size:12.5px;color:var(--muted);line-height:1.75}
.fn2{font-size:12px;color:var(--muted);line-height:1.7;margin:-1px 0 3px}

.identity{margin-bottom:0}
.subbox{padding:0;margin-top:9px}
.subbox:first-of-type{margin-top:16px}
.sublbl{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:9px;
  display:flex;align-items:center;gap:7px}
.subbox.warn{border-top-color:rgba(192,57,43,.25)}
.sublbl.warn{color:var(--maternal);font-weight:700;letter-spacing:.04em;font-size:12.5px}
.sublbl.warn svg{width:14px;height:14px;stroke-width:2.1}
.signquiet{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
  margin-top:16px;padding-top:14px;border-top:.5px solid var(--hair)}
.signquiet svg{width:13px;height:13px;stroke-width:1.8;color:var(--ok)}
.findgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media(max-width:420px){.findgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fnd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;
  background:var(--glass2);border-radius:11px;padding:9px 8px 10px;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75)}
.fnd .fic{color:var(--accent);opacity:.85}
.fnd .fic svg{width:14px;height:14px}
.fnd .fk2{font-size:10px;color:var(--ink);letter-spacing:0;margin-top:2px;white-space:nowrap}
.fnd .fv2{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:0}

.fitems{display:flex;flex-direction:column;gap:9px}
.fitem{background:var(--accentBg);border-radius:var(--r-md);padding:9px 15px 10px;
  box-shadow:inset 0 0 0 .5px rgba(140,106,74,.18)}
.fitem .fnm{font-size:12.5px;color:var(--ink);font-weight:600;letter-spacing:.03em;margin-bottom:3px}
.ftrow{display:flex;align-items:baseline;gap:8px}
.ftrow svg{width:16px;height:16px;color:var(--accent);opacity:.8;stroke-width:1.7}
.ftrow .ft{font-family:var(--mono);font-size:16px;font-weight:700}
.fitem .fa{font-size:12.5px;color:var(--ink);font-weight:600;margin-left:auto}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin:0}
.vchip{display:inline-flex;align-items:baseline;gap:6px;padding:7px 13px;border-radius:var(--r-pill);
  background:var(--glass2);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8)}
.vchip .ck{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.vchip .cv{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:0}

.lbl{font-size:11px;color:var(--faint);letter-spacing:.12em;margin:20px 0 8px}
.subbox .fcrow:first-of-type{border-top:none}
.fcrow{display:flex;flex-direction:column;gap:3px;padding:10px 0 2px;font-size:16px;
  border-top:.5px solid var(--hair)}
.fcrow:first-of-type{border-top:none;padding-top:0}
.fcrow .fk{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.fcrow .ft{font-family:var(--mono);font-weight:700;letter-spacing:0}
.subbox .fa{display:block;font-size:12px;color:var(--faint);padding:0 0 10px;
  border-top:none;margin-top:-2px}

.signpill{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:700;
  padding:9px 17px 9px 13px;border-radius:var(--r-pill);margin-top:18px;
  background:var(--glass2);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8)}
.signpill svg{width:16px;height:16px;stroke-width:2.1}
.signpill.ok{color:var(--ok)}
.signpill.warn{color:var(--maternal);background:rgba(192,57,43,.10)}

/* ---------- タイムライン（経過予測） ---------- */
.tl{padding-left:24px}
.tl::before{content:'';position:absolute}
.tl{position:relative}
.tl::before{left:6px;top:6px;bottom:10px;width:1.5px;background:var(--hair)}
.tli{position:relative;padding-bottom:24px}
.tli:last-child{padding-bottom:0}
.tli>.dot{position:absolute;left:-24px;top:5px;width:11px;height:11px;border-radius:50%;
  background:var(--accent);border:3px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 1px rgba(140,106,74,.55)}
.tli.dim>.dot{background:#D8D0C2;box-shadow:0 0 0 1px var(--hair)}
.tli.acc>.dot{background:var(--fetal);box-shadow:0 0 0 1px rgba(47,102,144,.5)}
.tli .tnm{font-size:15.5px;font-weight:700;letter-spacing:.02em}
.tli .tnow{display:inline-block;font-size:10px;font-weight:700;color:#fff;
  background:var(--accent);border-radius:var(--r-pill);padding:2px 9px;margin-left:9px;letter-spacing:.04em}
.tli .ttime{font-family:var(--mono);font-size:14.5px;margin-top:5px;letter-spacing:0}
.tli .tdur{font-size:12px;color:var(--muted);margin-top:2px}

/* 考えられる可能性：見出し（開閉どちらも同じ見た目） */
.posslbl{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:400;
  letter-spacing:.04em;color:var(--faint);margin:13px 0 0}
.posslbl svg{width:6px;height:6px;color:var(--faint)}
.stfold{margin-top:12px}
.stfold>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;
  padding:11px 34px 11px 14px;position:relative;border-radius:var(--r-sm);
  background:rgba(140,106,74,.20);box-shadow:inset 0 0 0 .5px rgba(140,106,74,.3)}
.stfold>summary::-webkit-details-marker{display:none}
.stfold>summary::after{content:'';position:absolute;right:14px;top:50%;width:7px;height:7px;
  margin-top:-5px;border-right:1.6px solid var(--accent2);border-bottom:1.6px solid var(--accent2);
  transform:rotate(45deg);transition:transform .15s}
.stfold[open]>summary::after{transform:rotate(-135deg);margin-top:-3px}
.fp{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
  letter-spacing:.06em;color:var(--accent2)}
.fp svg{width:6px;height:6px;color:var(--accent)}
.stfold[open]>summary{border-radius:var(--r-sm) var(--r-sm) 0 0;margin-bottom:0}
.stfold>.body{padding:12px 12px 2px;background:rgba(140,106,74,.09);
  border-radius:0 0 var(--r-sm) var(--r-sm)}

/* 可能性ボックス：幅を統一して大きく */
/* ---------- 経腟分娩の可否（学生モード） ---------- */
.stsub{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--faint);margin:16px 0 8px}
.stsub:first-of-type{margin-top:0}
.vitem{background:var(--glass2);border-radius:var(--r-md);padding:13px 15px 13px 13px;margin:0 0 9px;
  border-left:3px solid var(--rule);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75)}
.vitem:last-of-type{margin-bottom:0}
.vitem.v-neg{border-left-color:var(--ok)}
.vitem.v-hold{border-left-color:var(--watch)}
.vitem.v-un{border-left-color:var(--faint)}
.vitem.v-hit{border-left-color:var(--maternal)}

.vcleargrp{display:flex;flex-direction:column;gap:1px}
.vclear{background:var(--glass2)}
.vclear:first-child{border-radius:var(--r-sm) var(--r-sm) 0 0}
.vclear:last-child{border-radius:0 0 var(--r-sm) var(--r-sm)}
.vclear>summary{display:flex;align-items:center;gap:10px;padding:11px 14px;
  cursor:pointer;list-style:none;position:relative}
.vclear>summary::-webkit-details-marker{display:none}
.vclear>summary::after{content:'';position:absolute;right:14px;width:6px;height:6px;
  border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);
  transform:rotate(45deg);transition:transform .15s}
.vclear[open]>summary::after{transform:rotate(-135deg)}
.vclear .vnm{font-size:13.5px;font-weight:600}
.vclear .vst{margin-left:auto;font-size:10px;padding:2px 9px}
.vclear>.body{padding:0 14px 12px 14px}
.vhd{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.vnm{font-size:14.5px;font-weight:700;letter-spacing:.01em}
.vst{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  padding:2px 10px;border-radius:999px;white-space:nowrap}
.vst.v-neg{background:rgba(63,125,83,.13);color:var(--ok)}
.vst.v-hold{background:rgba(169,132,32,.15);color:var(--watch)}
.vst.v-un{background:var(--hair);color:var(--faint)}
.vst.v-hit{background:rgba(192,57,43,.13);color:var(--maternal)}
.vr{padding:6px 0 0;font-size:12.5px;line-height:1.7}
.vk{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:1px}
.vbs{color:var(--muted)}
.concl{margin-top:14px;padding:13px 15px;border-radius:var(--r-md);font-size:14px;
  line-height:1.75;font-weight:600;white-space:pre-line}
.concl-ok,.concl-okUn{background:rgba(63,125,83,.10);color:#2C6B42}
.concl-hold{background:rgba(169,132,32,.12);color:#8C6A1E}
.concl-hit{background:rgba(192,57,43,.10);color:var(--maternal)}

.pbox{background:var(--glass2);border-radius:var(--r-md);padding:15px 17px;margin:0 0 10px;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75)}
.pbox:last-child{margin-bottom:0}
.pbox>details>summary.pt{display:block;position:relative;list-style:none;cursor:pointer;padding-right:20px}
.pbox>details>summary.pt::-webkit-details-marker{display:none}
.pbox>details>summary.pt::after{content:'';position:absolute;right:1px;top:8px;
  width:7px;height:7px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);
  transform:rotate(45deg);transition:transform .15s}
.pbox>details[open]>summary.pt::after{transform:rotate(-135deg);top:11px}
.ubadge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  letter-spacing:.06em;padding:3px 10px 3px 8px;border-radius:var(--r-pill);margin-bottom:8px}
.ubadge.u-maternal{background:rgba(192,57,43,.13);color:var(--maternal)}
.ubadge.u-fetal{background:rgba(47,102,144,.13);color:var(--fetal)}
.ubadge.u-report{background:rgba(181,101,29,.13);color:var(--report)}
.ubadge.u-watch{background:rgba(169,132,32,.13);color:var(--watch)}
.ptname{display:block;font-size:15.5px;font-weight:700;letter-spacing:.02em;line-height:1.5}
.why2{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:6px;
  line-height:1.7;letter-spacing:0}
.pbox>details>.body{padding-top:6px}
.prow{padding:11px 0 2px;border-top:.5px solid var(--hair);margin-top:9px;font-size:13.5px;line-height:1.75}
.prow:first-of-type{margin-top:11px}
.wnote{color:var(--muted);font-size:.92em;margin-left:3px}
.pcont{font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--accent2);
  background:var(--accentBg);border-radius:999px;padding:2px 9px;white-space:nowrap}
.pst{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);
  background:var(--glass2);border-radius:999px;padding:2px 9px;white-space:nowrap;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8)}

/* ---------- 目標とケア（各期に埋め込む） ---------- */
.gcbox{margin-top:11px;padding:12px 14px;background:var(--glass2);border-radius:var(--r-md);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75)}
.gclbl{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent2);margin:0 0 6px}
.gclbl:not(:first-child){margin-top:13px;padding-top:12px;border-top:.5px solid var(--hair)}
.gcsub{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink);margin:7px 0 3px}
.gcsub:first-of-type{margin-top:0}
.gclist{list-style:none;margin:0;padding:0}
.gclist li{position:relative;padding:3px 0 3px 14px;font-size:13px;line-height:1.75;color:var(--ink)}
.gclist li::before{content:'';position:absolute;left:2px;top:12px;width:4px;height:4px;
  border-radius:50%;background:var(--accent)}
.gcnone{font-size:12.5px;color:var(--muted);padding:3px 0 3px 14px;line-height:1.75}

.prow .pk{display:flex;align-items:center;gap:5px;font-size:11.5px;letter-spacing:.08em;
  font-weight:700;color:var(--ink);margin-bottom:4px}
.prow .pk svg{width:12px;height:12px;stroke-width:1.8;opacity:1}
.prow ul{margin:0;padding-left:16px}
.prow li{margin:3px 0}

/* ---------- 医師との連携（報告基準） ---------- */
.rboxes{display:flex;flex-direction:column;gap:11px}
.rbox{background:var(--glass2);border-radius:var(--r-md);padding:15px 16px;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75)}
.rbox>h4{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:14px;
  font-weight:700;letter-spacing:.03em}
.ric{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;flex:0 0 auto}
.ric svg{width:11px;height:11px;stroke-width:2.4;color:#fff}
.rbox.now{background:rgba(192,57,43,.09)}
.rbox.now .ric{background:var(--maternal)} .rbox.now>h4{color:#A5372A}
.rbox.chk .ric{background:var(--report)} .rbox.chk>h4{color:#95530C}
.rbox.obs .ric{background:var(--accent)} .rbox.obs>h4{color:var(--accent2)}
.rbox .cat{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--ink);margin:11px 0 4px}
.rbox .cat:first-of-type{margin-top:0}
.rbox ul{margin:0;padding-left:16px}
.rbox li{font-size:13.5px;line-height:1.8;margin:3px 0}
.urgprevrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.urgprev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  letter-spacing:.03em;padding:6px 12px;border-radius:999px;background:var(--glass2);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8)}
.urgprev .mk{font-family:var(--mono);letter-spacing:-.06em}
.urgprev .ct{font-family:var(--mono);font-weight:400;opacity:.75}
.urgprev.u-maternal{color:var(--maternal)} .urgprev.u-fetal{color:var(--fetal)}
.urgprev.u-report{color:var(--report)} .urgprev.u-watch{color:var(--watch)}
details.rfold>summary{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;
  color:#95530C;padding:15px 16px;border-radius:var(--r-md);cursor:pointer;list-style:none;
  background:var(--glass2);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75);
  flex-wrap:wrap;white-space:nowrap}
/* 見出しの語を1行に保つ。件数と説明は折り返してよい */
details.rfold>summary .cnt,details.rfold>summary .foldwhat{white-space:normal}
details.rfold>summary::-webkit-details-marker{display:none}
details.rfold>summary svg{width:14px;height:14px;stroke-width:2}
details.rfold>summary .cnt{font-size:11.5px;font-weight:600;color:var(--muted)}
/* 説明の1行は行を分けて全幅で出す（見出しの語と同じ行に詰めない） */
details.rfold>summary .foldwhat{flex-basis:100%;margin-top:2px}
details.rfold>.body{padding:12px 16px 2px}
details.rfold>.body .cat{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--ink);margin:11px 0 4px}
details.rfold>.body .cat:first-of-type{margin-top:0}
details.rfold>.body ul{margin:0;padding-left:16px}
details.rfold>.body li{font-size:13.5px;line-height:1.8;margin:3px 0}
details.rfold>summary svg{color:var(--report)}

/* ---------- 期のカード内の余白調整 ---------- */
.stage{margin-bottom:8px}
.stage:last-child{margin-bottom:0}

/* ---------- 常に頭に置くこと ---------- */
.bul{margin:0;padding:0;list-style:none}
.bul li{position:relative;padding:6px 0 6px 17px;font-size:13.5px;line-height:1.75;
  border-top:.5px solid var(--hair)}
.bul li:first-child{border-top:none;padding-top:2px}
.bul li::before{content:'';position:absolute;left:2px;top:14px;width:4.5px;height:4.5px;
  border-radius:50%;background:var(--accent)}
.bul li.now{font-weight:700;color:var(--maternal)}
/* 常に頭に置くこと：所見(入口)を主役に、赤は即報告バッジだけに限定する */
.signlist{list-style:none;margin:0;padding:0}
.fn.intro{font-size:12px;color:var(--muted);letter-spacing:.02em;
  padding-bottom:12px;margin-bottom:2px;border-bottom:.5px solid var(--hair)}
.signlist li{border:none;padding:0}
.signlist li::before{display:none}
.signlist .sgrow{display:flex;align-items:flex-start;justify-content:space-between;
  gap:12px;padding:13px 0;border-top:.5px solid var(--hair)}
.signlist .sgrow:first-child{border-top:none;padding-top:2px}
.signlist .sgtext{flex:1;min-width:0;line-height:1.65;font-size:13.5px}
.signlist .sgn{display:block;color:var(--ink);font-weight:400}
.signlist .dxline{display:block;margin-top:2px;color:var(--muted);font-weight:400}
.signlist .arw{color:var(--faint);margin-right:5px;font-weight:400}
.signlist .dxn{color:var(--muted);font-weight:400}
.signlist .now-tag{flex:0 0 auto;align-self:flex-start;margin-top:1px;font-size:10px;
  font-weight:700;letter-spacing:.03em;color:#fff;background:var(--maternal);
  border-radius:999px;padding:2px 9px;white-space:nowrap}
.bul li.now::before{background:var(--maternal)}

/* ---------- この判定の元になった情報 ---------- */
.sech .cnt{margin-left:auto;font-size:11px;font-weight:400;color:var(--faint)}
.urg{display:flex;align-items:center;gap:9px;margin:18px 0 10px;font-size:11px;letter-spacing:.14em}
.urg:first-of-type{margin-top:6px}
.urg .mk{font-family:var(--mono);letter-spacing:-.06em}
.urg .ct{font-family:var(--mono);color:var(--faint);margin-left:auto;font-size:11px}
.u-maternal{color:var(--maternal)} .u-fetal{color:var(--fetal)}
.u-report{color:var(--report)} .u-watch{color:var(--watch)}

.p{background:#fff;border:none;border-left:3px solid var(--rule,#D8D0C2);border-radius:var(--r-md);
  padding:15px 16px 16px;margin:0 0 11px;
  box-shadow:0 2px 10px rgba(90,74,56,.06), inset 0 0 0 .5px rgba(0,0,0,.03)}
.p .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.p .no{font-size:11px;color:var(--faint);letter-spacing:.1em}
.p .st{margin-left:auto;font-size:10.5px;padding:2px 10px;border-radius:var(--r-pill);
  border:.5px solid var(--hair);color:var(--muted);background:var(--paper)}
.p .nm{font-size:15.5px;font-weight:700;line-height:1.5;letter-spacing:.01em;margin-bottom:8px}
.p .r{padding:9px 0;border-top:.5px solid var(--hair);font-size:13px;line-height:1.8}
.p .r:first-child{border-top:none;padding-top:2px}
.p .r .k{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--faint);margin-bottom:2px}
.p.g-maternal{border-left-color:var(--maternal)}
.p.g-fetal{border-left-color:var(--fetal)}
.p.g-report{border-left-color:var(--report)}
.p.g-watch{border-left-color:var(--watch)}
.via{font-family:var(--mono);font-size:11px;color:var(--faint)}
.need{color:var(--watch)}
.nolist{font-size:13px;line-height:2}
.nolist b{font-family:var(--mono);color:var(--faint);font-weight:400;margin-right:6px}
.tiny{font-size:12.5px;line-height:1.85;color:var(--muted)}
.tiny b{color:var(--ink)}

/* ---------- タグ／サイン ---------- */
.tag{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;
  border-radius:var(--r-sm);padding:9px 15px}
.tag svg{width:14px;height:14px}
.tag.ok{background:rgba(63,125,83,.10);color:var(--ok)}
.tag.warn{background:rgba(192,57,43,.10);color:var(--maternal)}

/* ---------- 免責・注記 ---------- */
.txtout{text-align:center;margin:14px 0 4px}
.txtout button{font-family:var(--jp);font-size:11.5px;color:var(--faint);
  background:none;border:none;padding:6px 10px;cursor:pointer;letter-spacing:.03em;
  text-decoration:underline;text-underline-offset:3px}
.txtout button:active{color:var(--muted)}
.disc{background:var(--glass2);border-radius:var(--r-md);padding:15px 17px;
  font-size:11.5px;line-height:1.9;color:var(--muted);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75);margin-top:2px}

/* ---------- 履歴 ---------- */
.histcard{margin:0 0 11px;padding:15px 16px;cursor:pointer}
.histrow{display:flex;align-items:flex-start;gap:10px}
.histmain{flex:1;min-width:0}
.histid{font-size:14.5px;font-weight:700;color:var(--ink);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.histid .sep{color:var(--faint);font-weight:400}
.histts{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--muted)}
.histph{font-size:13px;font-weight:600;color:var(--accent2);margin:4px 0 3px}
.histdel{flex:0 0 auto;background:none;border:none;font-size:16px;padding:4px 6px;
  cursor:pointer;opacity:.55;border-radius:8px}
.histdel:active{opacity:1;background:rgba(192,57,43,.1)}
.gnote{font-size:11.5px;color:var(--faint);line-height:1.75;margin-top:10px}

/* ================================================================
   入力画面
   ================================================================ */
.grp{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r-lg);
  padding:20px 18px 22px;margin:0;
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 12px 32px rgba(90,74,56,.10), 0 1px 2px rgba(90,74,56,.05)}
.gsec{margin:0 0 22px}
.gsec:last-child{margin-bottom:16px}
.gsec>.sech{display:flex;align-items:center;gap:10px}
.gsec.foldable > .sech{cursor:pointer}
.gsec.foldable > .sech::after{content:'▾';margin-left:2px;font-size:11px;color:var(--muted)}
.gsec.closed > .sech::after{content:'▸'}
.gsec.closed > .grp{display:none}
.gfold{font-size:11px;letter-spacing:.02em;color:var(--muted);margin-left:auto}
.grpbtn{margin-left:auto;font-size:11.5px;letter-spacing:.02em;padding:4px 11px;
  border-radius:var(--r-pill);border:1px solid var(--edge);background:transparent;
  color:var(--muted);cursor:pointer}
/* ---------- Segmented Control: 選択インジケーター ---------- */
.segwrap{position:relative;display:inline-flex;gap:6px}
.seg-ind{position:absolute;left:0;top:0;z-index:0;pointer-events:none;opacity:0;
  background:var(--accent);border-radius:var(--r-pill);
  transition:transform .4s cubic-bezier(.34,1.22,.5,1), width .3s cubic-bezier(.34,1.22,.5,1),
    opacity .18s ease}
.seg-ind.ready{opacity:1}
.seg-ind.nav{border-radius:14px;background:var(--accentBg)}

.yn{position:relative;margin-left:auto;display:flex;gap:5px}
.ynb{position:relative;z-index:1;font-size:11.5px;letter-spacing:.02em;padding:5px 13px;border-radius:var(--r-pill);
  background:var(--glass2);color:var(--muted);cursor:pointer;font-weight:400;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8)}
.ynb.on{background:transparent;color:#fff;font-weight:700;transition:color .2s ease .08s}
.gbody{padding-top:12px}

.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px 12px}
.row+.row{margin-top:12px}
.row.n2{grid-template-columns:1.5fr 1fr;gap:8px;max-width:260px}
.row.n2c{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 10px;max-width:320px}
.row.n2v{grid-template-columns:1.1fr 1.3fr;gap:9px 10px;max-width:390px}
.row.full{grid-template-columns:1fr;gap:10px;max-width:300px}
.row.n2r{grid-template-columns:1.35fr 1fr;gap:9px 10px;max-width:390px}
.row.n2s{grid-template-columns:1fr 1.25fr;gap:9px 10px;max-width:420px}
.row.uc1{grid-template-columns:1fr;max-width:210px}
/* 列数を固定せず、画面幅で折り返す（指示B-4・6-1）。
   repeat(3,...) を max-width:300px で囲むと、狭い画面では1列100pxまで潰れ、
   「-3」「+1」や妊娠週数が数字1桁ぶんしか見えなくなっていた。
   auto-fit と minmax で、入る数だけ並べて残りは次の行へ送る。 */
.row.n3,.row.n3b{grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px 8px;max-width:330px}
.row.n3w{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px 8px;max-width:400px}
.row.n4,.row.n4a{grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px 8px;max-width:420px}
.row.n4f{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:9px 7px;max-width:470px}
.row.nw{grid-template-columns:1fr;max-width:200px}
.row[class*="b1a"],.row[class*="b2a"],.row[class*="b3a"],
.row[class*="b4a"],.row[class*="b5a"],.row[class*="b6a"]{
  grid-template-columns:1.15fr 1.35fr;gap:9px 10px;max-width:420px}
.row[class*="b1b"],.row[class*="b2b"],.row[class*="b3b"],
.row[class*="b4b"],.row[class*="b5b"],.row[class*="b6b"]{
  grid-template-columns:.75fr .8fr 1.5fr;gap:9px 8px;max-width:420px;margin-bottom:14px}
.row[class*="b"] .f>label{font-size:11px}

.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label{font-size:12px;color:var(--muted);letter-spacing:.03em}
/* 数値入力の増減矢印（スピナー）は出さない。体温や血圧を1ずつ上下させる操作は使わないため */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}

.f input[type=number],.f input[type=text],.f input[type=datetime-local],.f select{
  font-family:var(--mono);font-size:16px;padding:11px 13px;border:1px solid var(--rule);
  border-radius:13px;background:rgba(255,255,255,.55);color:var(--ink);width:100%;
  min-width:0;box-sizing:border-box}
.f input[type=datetime-local]{font-size:15px;padding-left:10px;padding-right:6px}
.f select{font-family:var(--jp)}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent);border-width:1.5px;
  background:#fff}
.f .unit{font-family:var(--mono);font-size:10.5px;color:var(--faint)}

.ddpair{display:flex;gap:5px}
.ddpair select,.ddpair input{flex:1 1 0;min-width:0;font-family:var(--mono);font-size:16px;
  padding:11px 6px;border:1px solid var(--rule);border-radius:13px;background:rgba(255,255,255,.55);
  color:var(--ink);text-align:center}
.ddpair select{text-align-last:center}
.ddpair select:focus,.ddpair input:focus{outline:none;border-color:var(--accent);
  border-width:1.5px;background:#fff}
.ddpair input::placeholder{color:var(--faint);font-size:11px}
.ddpair.age select{padding:11px 2px}
.ddpair .sl{flex:0 0 auto;color:var(--faint);font-family:var(--jp);font-size:12.5px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13.5px;padding:10px 16px;border-radius:var(--r-pill);
  background:var(--glass2);cursor:pointer;user-select:none;color:var(--muted);line-height:1.4;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8)}
.chip.on{background:var(--accent);color:#fff;font-weight:600}

.cklist{display:grid;grid-template-columns:1fr;gap:8px}
.ck{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;
  border-radius:var(--r-md);user-select:none;background:var(--glass2);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8)}
.ck .box{flex:0 0 auto;width:21px;height:21px;border:1.5px solid var(--faint);
  border-radius:50%;background:rgba(255,255,255,.7);position:relative}
.ck .lb{font-size:14.5px;line-height:1.6;color:var(--ink)}
.ck.on{background:var(--accentBg)}
.ck.on .box{background:var(--accent);border-color:var(--accent)}
.ck.on .box::after{content:'';position:absolute;left:6px;top:2.5px;width:4.5px;height:9.5px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}

.calc{font-family:var(--mono);font-size:12px;color:var(--muted);border-radius:13px;
  padding:11px 13px;margin-top:14px;line-height:1.75;background:var(--glass2);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75)}
.calc b{color:var(--ink);font-weight:700}
.calc .hit{color:var(--maternal);font-weight:700}

/* ---------- タブ（母体・胎児…） ---------- */
.tabs{display:flex;gap:0;max-width:640px;margin:0 auto;padding:0 6px;overflow-x:auto;
  -webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:60px;font-family:var(--jp);font-size:12.5px;padding:11px 10px 10px;
  border:none;border-top:2px solid transparent;background:none;color:var(--muted);
  cursor:pointer;white-space:nowrap;letter-spacing:.02em;position:relative}
.tabs button.on{color:var(--accent);border-top-color:var(--accent);font-weight:700}
.tabs button .badge{font-family:var(--mono);font-size:9px;color:#fff;
  background:var(--accent);border-radius:var(--r-pill);padding:1px 6px;margin-left:5px}
.tabs button .badge:empty{display:none}
.pane{display:none;padding:16px 0 4px}
.pane.on{display:block}

/* ---------- 下部バー ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(248,246,242,.72);
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  border-top:.5px solid var(--edge);box-shadow:0 -8px 24px rgba(90,74,56,.06)}
.bottom.hideTabs .tabs{display:none}
.runbar{max-width:640px;margin:0 auto;padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.runbar .stline{padding:0 1px}
.runbar .st{display:block;font-size:11.5px;color:var(--muted);line-height:1.5;max-height:2.9em;overflow:hidden}
.runbar .in{display:flex;gap:7px;align-items:center;margin-top:6px}
.runbar .in .sp{flex:1}
.btn{font-family:var(--jp);font-size:15.5px;padding:14px 14px;border:none;border-radius:14px;
  background:var(--accent);color:#fff;cursor:pointer;font-weight:700;letter-spacing:.02em;
  flex:1;white-space:nowrap}
.btn.sub{background:var(--glass2);color:var(--accent);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8);
  flex:0 0 auto;padding:10px 13px;font-size:13px;font-weight:600}
.btn.danger{background:none;color:var(--faint);font-weight:400;padding:10px 8px;font-size:12.5px;flex:0 0 auto}
.btn.danger:hover{color:var(--maternal)}

.navtabs{position:relative;display:flex;max-width:640px;margin:0 auto;padding:2px 4px}
.navtabs button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;padding:8px 4px;color:var(--faint);font-family:var(--jp);
  font-size:10px;cursor:pointer;letter-spacing:.02em}
.navtabs button svg{width:19px;height:19px;stroke-width:1.6}
.navtabs button.on{color:var(--accent);font-weight:700}

/* ---------- モード切替バー ---------- */
.modebar{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.modebar button{position:relative;z-index:1;font-family:var(--jp);font-size:12.5px;padding:8px 15px;border:none;
  background:var(--glass2);color:var(--ink);border-radius:var(--r-pill);cursor:pointer;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8)}
.modebar button.on{background:var(--accent);color:#fff;font-weight:700}
#mClinical.on,#mStudent.on{background:transparent;transition:color .2s ease .08s}
.modebar .sp{flex:1}
.modebar button.dev{color:var(--faint);opacity:.7}
.modebar button.dev::before{content:'開発用 ';font-size:9.5px;letter-spacing:.04em}
.modebar button.dev.on{background:var(--muted);color:#fff}
.modebar button.ib{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.modebar button.ib .em{font-size:14px;line-height:1;filter:saturate(.85)}

/* ---------- プロンプト表示 ---------- */
pre.pr{white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;line-height:1.65;
  background:var(--glass2);border:none;border-radius:var(--r-md);padding:14px;
  max-height:60vh;overflow:auto;margin:0;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75)}
.gen{white-space:pre-wrap;font-size:14.5px;line-height:1.9;color:var(--ink)}
.genhead{white-space:normal;font-weight:700;font-size:13px;letter-spacing:.05em;
  color:var(--ink);display:block;width:fit-content;max-width:100%;padding-bottom:3px;margin:24px 0 8px;
  background:linear-gradient(90deg,var(--accent) 0%,rgba(140,106,74,.3) 65%,transparent 100%);
  background-repeat:no-repeat;background-position:0 100%;background-size:100% 2.5px}
.gen>.genhead:first-child{margin-top:0}
.genlbl{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--muted);margin:10px 0 3px}
.genli{position:relative;padding:3px 0 3px 15px;font-size:13.5px;line-height:1.7;color:var(--ink)}
.genli::before{content:'';position:absolute;left:2px;top:12px;width:4.5px;height:4.5px;
  border-radius:50%;background:var(--accent)}
.genbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px}
.genbtn{width:32px;height:32px;padding:0;border:none;border-radius:50%;
  background:var(--glass2);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8);
  font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.genbtn:active{background:var(--glass3)}
.err{border-left:3px solid var(--maternal);border-radius:var(--r-md);
  background:rgba(192,57,43,.08);padding:11px 14px;font-size:13px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--hair);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}

.forecast dl{display:grid;grid-template-columns:9em 1fr;gap:4px 10px;margin:0}
.forecast dt{color:var(--muted);font-size:12px}
.forecast dd{margin:0;font-family:var(--mono);font-size:13px}
.forecast dd.jp{font-family:var(--jp);font-size:13.5px}
.gate{border-radius:var(--r-md);padding:13px 15px;background:var(--glass2);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75)}
.gate.clear{color:var(--muted)}

@media print{
  .bottom,.modebar,header,#caseBar{display:none!important}
  @page{margin:12mm}
  body{padding:0;background:#fff;font-size:11pt}
  .card,.grp{background:#fff;box-shadow:none;border:.5px solid #ddd;break-inside:avoid}
  .disc{background:#fff}
}
/* 変数名を実在するものに直した。--bg / --card / --grid / --danger は
   このアプリには存在せず、指定が効かずに背景が透けていた。 */
#scAuth{position:fixed;inset:0;z-index:9000;background:#F3F1EC;overflow:auto}
#scAuth.on{display:block}
.authwrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  box-sizing:border-box}
.authcard{width:100%;max-width:360px;background:#fff;border:1px solid var(--edge);
  border-radius:var(--r-lg);padding:26px 22px;box-sizing:border-box;
  box-shadow:0 12px 32px rgba(90,74,56,.10), 0 1px 2px rgba(90,74,56,.05)}
.authttl{font-size:17px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
.authsub{font-size:12px;color:var(--muted);margin:6px 0 20px;line-height:1.7}
.af{margin:0 0 14px}
.af>label{display:block;font-size:12px;color:var(--muted);letter-spacing:.03em;margin-bottom:5px}
.af input,.af select{width:100%;box-sizing:border-box;padding:10px 12px;font-size:15px;
  border:1px solid var(--edge);border-radius:var(--r-md);background:#fff;color:var(--ink)}
.ahint{font-size:11px;color:var(--faint);margin-left:6px}
/* パスワードの表示・非表示。打ち間違いに気づけるようにする */
.pwwrap{position:relative}
.pwwrap>input{padding-right:56px}
.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:none;border:0;padding:6px 8px;font-size:12px;color:var(--muted);
  cursor:pointer;letter-spacing:.02em}
/* 認証画面の「助産師／助産学生」は、入力画面の .ynb.on と同じ見た目にすると
   後ろで動く目印（.seg-ind）が無いため白い文字だけが残って読めなくなる。
   この画面だけは、選んだ側を塗りつぶす形にする。 */
#su_role{display:flex;gap:8px;margin-top:2px}
#su_role .ynb{flex:1 1 0;text-align:center;font-size:13px;padding:9px 0;
  border:1px solid var(--edge);border-radius:var(--r-pill);
  background:#fff;color:var(--muted);font-weight:400;cursor:pointer}
#su_role .ynb.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ahint2{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.aerr{font-size:12px;color:#b3261e;margin:0 0 10px;line-height:1.6;min-height:1px}
.abtn{width:100%;padding:12px;font-size:15px;font-weight:700;letter-spacing:.03em;
  border:0;border-radius:var(--r-md);background:var(--accent);color:#fff;cursor:pointer}
.abtn.sub{background:transparent;color:var(--muted);border:1px solid var(--edge);font-weight:400}
.alink{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.atext{background:none;border:0;padding:0;font-size:12px;color:var(--muted);
  text-decoration:underline;cursor:pointer}
.anote{font-size:11.5px;color:var(--faint);line-height:1.7;margin-top:16px}
.awaitmsg{font-size:13px;line-height:1.9;color:var(--ink);margin:4px 0 20px;white-space:pre-line}

/* 畳んだ見出しに付ける1行の要約（AU裁定 2026-08-04）。
   畳むのは隠すためではなく見出しにするため、という原則にもとづく。
   件数だけでは何の見出しか伝わらないので、中身が分かる語を添える。
   学生が読み飛ばしても、そこに何があるかは伝わるようにする。 */
.foldwhat{display:block;font-size:11px;font-weight:400;color:var(--muted);
  line-height:1.6;margin-top:2px;letter-spacing:0}

/* 関門の「この先いっしょに見ていくもの」（畳んで置く） */
.gwfold{margin:5px 0 2px}
.gwfold summary{font-size:11.5px;color:var(--muted);cursor:pointer;list-style:none;
  display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:var(--r-pill);
  border:1px solid var(--edge);background:#fff}
.gwfold summary::-webkit-details-marker{display:none}
.gwfold summary::before{content:'▸';font-size:9px;color:var(--muted)}
.gwfold[open] summary::before{content:'▾'}
.gwbody{margin-top:6px;padding-left:2px}
.gwrow{font-size:11.5px;line-height:1.75;margin-bottom:5px}
.gwnm{display:block;font-weight:700;color:var(--ink)}
.gwit{color:var(--muted)}

/* 経過を追わなければ判断できないもの（各期の可能性の先頭にまとめて置く） */
.wlater{border:1px solid var(--edge);border-radius:var(--r-md);background:#FAF8F4;
  padding:10px 12px;margin-bottom:10px}
.wlaterh{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  color:var(--ink);margin-bottom:7px}
.wlaterh svg{width:15px;height:15px;flex:none;color:var(--muted)}
.wlaterh .cnt{font-size:11px;font-weight:400;color:var(--muted);margin-left:2px}
.wlaterl{display:flex;flex-wrap:wrap;gap:5px 6px;margin-bottom:7px}
.wl1{font-size:12px;padding:2px 9px;border-radius:var(--r-pill);
  border:1px solid var(--edge);background:#fff;color:var(--ink)}
.wlaterf{font-size:11.5px;line-height:1.75;color:var(--muted)}

/* ============ 管理画面 ============
   role が admin のときだけ開く。アセスメントの画面とは分ける。
   認証画面と同じ地色を使い、別の場所であることが分かるようにする。 */
#scAdmin{position:fixed;inset:0;z-index:8500;background:#F3F1EC;overflow:auto;display:none}
#scAdmin.on{display:block}
.adwrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;box-sizing:border-box}
.adhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.adttl{font-size:16px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
.adtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.adtab{flex:1 1 0;min-width:110px;padding:9px 6px;font-size:13px;text-align:center;cursor:pointer;
  border:1px solid var(--edge);border-radius:var(--r-pill);background:#fff;color:var(--muted)}
.adtab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.adtab .n{font-size:11px;margin-left:5px;opacity:.85}
.adcard{background:#fff;border:1px solid var(--edge);border-radius:var(--r-lg);
  padding:14px 16px;margin-bottom:10px}
.adname{font-size:14.5px;font-weight:700;color:var(--ink)}
.admail{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-all}
.adrow{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.adrow b{font-weight:400;color:var(--ink)}
.adtag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--r-pill);
  border:1px solid var(--edge);color:var(--muted)}
.adtag.warn{color:#b3261e;border-color:#b3261e}
.adacts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.adbtn{padding:8px 14px;font-size:13px;border-radius:var(--r-md);cursor:pointer;
  border:1px solid var(--edge);background:#fff;color:var(--ink)}
.adbtn.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.adbtn.danger{color:#b3261e;border-color:#b3261e}
.adterm{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.adterm button{padding:6px 12px;font-size:12px;border:1px solid var(--edge);
  border-radius:var(--r-pill);background:#fff;color:var(--muted);cursor:pointer}
.adterm button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.adterm input{padding:6px 10px;font-size:13px;border:1px solid var(--edge);
  border-radius:var(--r-md);background:#fff;color:var(--ink)}
.adnote{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:8px}
.adnote.warn{color:#b3261e}
.adempty{font-size:13px;color:var(--muted);padding:24px 4px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hrow">
    <h1>初期アセスメント</h1>
    <button id="hGuide" class="guidebtn" title="このアプリの見方">❓見方</button>
    <!-- 管理は入力画面からも開ける必要がある。hactions は入力画面で消えるためここに置く -->
    <button id="hAdmin" class="guidebtn" title="利用者の管理" style="display:none">⚙️管理</button>
    <div class="hactions" id="hactions">
      <button id="hRecord" class="ib emoji-only" title="この結果を記録に残す"><span class="em">📌</span></button>
      <button id="hCopy" class="ib emoji-only" title="コピー"><span class="em">📋</span></button>
      <button id="hPdf" class="ib emoji-only" title="PDFで保存"><span class="em">📄</span></button>
    </div>
  </div>
  <div class="sub" id="hdSub">入院したときの情報から、分娩経過の見通しと、経過のなかで見ていくことを出します</div>
</header>

<!-- ============ 入力画面 ============ -->
<!-- ============ ログイン・承認の画面 ============ -->
<div class="screen" id="scAuth">
  <div class="authwrap">
    <div class="authcard">
      <div class="authttl">分娩開始時アセスメント</div>
      <div class="authsub" id="au_sub">つづけるにはログインしてください</div>

      <!-- ログイン -->
      <div id="au_login">
        <div class="af"><label>メールアドレス</label>
          <input type="email" id="au_mail" inputmode="email" autocomplete="username"></div>
        <div class="af"><label>パスワード</label>
          <div class="pwwrap">
            <input type="password" id="au_pw" autocomplete="current-password">
            <button type="button" class="pweye" data-pw="au_pw">表示</button>
          </div></div>
        <div class="aerr" id="au_err"></div>
        <button class="abtn" id="au_go">ログイン</button>
        <div class="alink">
          <button class="atext" id="au_toSignup">はじめての方はこちら</button>
          <button class="atext" id="au_reset">パスワードを忘れた</button>
        </div>
      </div>

      <!-- 新規登録 -->
      <div id="au_signup" style="display:none">
        <div class="af"><label>メールアドレス</label>
          <input type="email" id="su_mail" inputmode="email" autocomplete="username"></div>
        <div class="af"><label>パスワード<span class="ahint">6文字以上</span></label>
          <div class="pwwrap">
            <input type="password" id="su_pw" autocomplete="new-password">
            <button type="button" class="pweye" data-pw="su_pw">表示</button>
          </div></div>
        <div class="af"><label>お名前</label>
          <input type="text" id="su_name" autocomplete="name"></div>

        <div class="af"><label>あなたは</label>
          <span class="yn" id="su_role">
            <span class="ynb" data-r="midwife">助産師</span>
            <span class="ynb" data-r="student">助産学生</span>
          </span></div>

        <div class="af" id="su_orgWrap"><label id="su_orgLbl">施設名<span class="ahint">任意</span></label>
          <input type="text" id="su_org"></div>

        <div class="af" id="su_courseWrap" style="display:none">
          <label>課程</label>
          <select id="su_course">
            <option value="">選んでください</option>
            <option value="1y">1年課程</option>
            <option value="2y-1">2年課程の1年目</option>
            <option value="2y-2">2年課程の2年目</option>
          </select>
          <div class="ahint2" id="su_gradNote"></div>
        </div>

        <div class="aerr" id="su_err"></div>
        <button class="abtn" id="su_go">登録する</button>
        <div class="alink">
          <button class="atext" id="su_toLogin">ログインにもどる</button>
        </div>
        <div class="anote">登録したあと、こちらで確認してから使えるようになります。
          少し時間がかかることがあります。</div>
      </div>

      <!-- 承認待ち・期限切れ -->
      <div id="au_wait" style="display:none">
        <div class="awaitmsg" id="au_waitmsg"></div>
        <button class="abtn sub" id="au_out">ログアウト</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 管理画面（role が admin のときだけ） ============ -->
<div id="scAdmin">
  <div class="adwrap">
    <div class="adhead">
      <div class="adttl">利用者の管理</div>
      <span style="flex:1"></span>
      <button class="adbtn" id="ad_reload">読み込み直す</button>
      <button class="adbtn" id="ad_close">閉じる</button>
    </div>
    <div class="adtabs" id="ad_tabs">
      <div class="adtab on" data-t="wait">承認待ち<span class="n" id="ad_n_wait"></span></div>
      <div class="adtab" data-t="live">利用中<span class="n" id="ad_n_live"></span></div>
      <div class="adtab" data-t="over">期限切れ<span class="n" id="ad_n_over"></span></div>
      <div class="adtab" data-t="rej">見送り<span class="n" id="ad_n_rej"></span></div>
    </div>
    <div id="ad_list"></div>
  </div>
</div>

<div class="screen on" id="scInput">
  <div id="panes"></div>
</div>

<!-- ============ 入力の確認 ============ -->
<div class="screen" id="scReview">
  <div class="modebar">
    <span class="sp"></span>
    <button id="rvBack">入力に戻る</button>
  </div>
  <div id="reviewOut"></div>
</div>

<!-- ============ 履歴 ============ -->
<div class="screen" id="scHistory">
  <div class="modebar">
    <span class="sech" style="margin:0">記録した産婦<span class="sm" id="histCount"></span></span>
    <span class="sp"></span>
    <button id="histClearAll">記録を全部消す</button>
    <button id="histBack">入力に戻る</button>
  </div>
  <div id="histOut"></div>
</div>

<!-- ============ 見方 ============ -->
<div class="screen" id="scGuide">
  <div class="modebar">
    <span class="sech" style="margin:0">このアプリの見方</span>
    <span class="sp"></span>
    <button id="guideBack">戻る</button>
  </div>
  <div id="guideOut"></div>
</div>

<!-- ============ 結果画面 ============ -->
<div class="screen" id="scResult">
  <div class="modebar">
    <span class="segwrap" id="segMode">
      <button id="mClinical" class="on">臨床</button>
      <button id="mStudent">学生</button>
    </span>
    <button id="mRaw" class="dev">判定のみ</button>
    <button id="mPrompt" class="dev">プロンプト</button>
    <span class="sp"></span>
    <button id="btnMock" class="dev">模擬</button>
    <button id="btnBack">入力に戻る</button>
  </div>
  <div id="out"></div>
</div>
</div>

<div class="bottom" id="bottom">
  <div class="tabs" id="tabs"></div>
  <div class="runbar" id="runbar">
    <div class="stline"><span class="st" id="runSt"></span></div>
    <div class="in">
      <button class="btn sub" id="btnReview">確認</button>
      <button class="btn" id="btnRun">アセスメントする</button>
    </div>
  </div>
  <div class="navtabs" id="navtabs"></div>

/* 対応表に無い項目のための自動照合。
   RULES の test が見ている入力キーを取り出し、関門項目のキーと突き合わせる。
   対応表を人が作らず、5資料にない判断も足さずに済む。
   語の一致だけで結ぶので、どの可能性にもつながらない項目には何も出さない
   （年齢・BMI・蛋白尿など）。出ないことは正しい動作である。 */
const RULE_KEYS = (() => {
  const map = {};
  for(const r of RULES){
    const src = String(r.test);
    map[r.id] = [...new Set((src.match(/I\.([A-Za-z][A-Za-z0-9_]*)/g)||[])
      .map(x => x.slice(2)))];
  }
  return map;
})();

/* 関門1件につながるものを返す。
   ① 対応表（GATE_LINK）があればそれを使う。AUが5資料を確かめて裁定したもの
   ② 対応表に無ければ、入力キーの自動照合で拾う
   立った可能性・要確認の可否項目からだけ拾う。
   除外・クリアになっているものは出さない（除外駆動の考え方を崩さないため）。 */
function gateLinks(hit){
  if(!hit.keys || !hit.keys.length || !R || !R.raised) return { poss:[], verd:[], none:null };
  const out = { poss:[], verd:[], none:null };
  const nos = new Set(), vns = new Set();
  let mapped = false;
  for(const k of hit.keys){
    const g = GATE_LINK[k];
    if(!g) continue;
    mapped = true;
    if(g.none){ out.none = g.none; continue; }
    (g.no||[]).forEach(n => nos.add(n));
    (g.v ||[]).forEach(n => vns.add(n));
  }
  /* 対応表に無い項目は、従来どおり入力キーの自動照合で拾う */
  if(!mapped){
    const ids = RULES.filter(r => (RULE_KEYS[r.id]||[]).some(k => hit.keys.includes(k)))
                     .map(r => r.id);
    RULES.filter(r => ids.includes(r.id)).forEach(r => (r.raise||[]).forEach(n => nos.add(n)));
  }
  out.poss = R.raised.filter(p => nos.has(p.no));
  /* 可否13項目は「要確認」「未測定」「該当」のものだけ。クリアは出さない */
  out.verd = (V && V.items ? V.items : []).filter(x => vns.has(x.name) && x.st !== '否定');
  return out;
}

// 入院時に状態が動くのは6件のみ。残り24件は保留固定。
const DECIDABLE = ['03','04','15','16','17','25','26'];

function judgeState(no, I) {
  switch (no) {
    case '03': // 過強陣痛・子宮頻収縮
      if (I.ucPer10 == null) return { s:'保留', why:'子宮収縮回数が未入力', need:'10分あたりの子宮収縮回数' };
      if (I.ucObsMinutes != null && I.ucObsMinutes < 30) return { s:'保留', why:'30分以上の区画の平均が取得できていない', need:'30分以上の分娩監視装置の記録' };
      if (I.ucPer10 > 5) return { s:'支持', why:`10分間に${I.ucPer10}回：5回を超える` };
      if (I.uterusRelaxes === false) return { s:'保留', why:'収縮回数は基準内だが間欠期に子宮が十分ゆるまない' };
      return { s:'否定', why:'収縮回数が過強基準に該当せず、間欠期に子宮がゆるむ' };
    case '04': // 早発努責
      if (I.pushing !== true) return { s:'保留', why:'努責をかけている所見がなく、入院時点では判断できない' };
      if (I.dilation != null && I.dilation >= 10) return { s:'否定', why:'子宮口全開大に達しており早発努責に当たらない' };
      if (I.dilation != null) return { s:'支持', why:`子宮口${I.dilation}cmで努責をかけている（努責が生じる目安は全開大かつstation+1より下降）` };
      return { s:'保留', why:'子宮口開大が未入力', need:'子宮口開大' };
    case '15': // 臍帯下垂
      if (I.cordPalpated) return { s:'支持', why:'内診で拍動する索状物を触れる' };
      if (I.headEngaged === false) return { s:'保留', why:'児頭未嵌入（station 0より上）のため破水時の脱出リスクを保持する' };
      if (I.cordPalpated === false) return { s:'否定', why:'内診で拍動する索状物を触れない' };
      return { s:'保留', why:'内診所見が未入力', need:'内診（臍帯の触知）' };
    case '16': // 臍帯脱出
      if (!I.rom) return { s:'保留', why:'破水しておらず判断できない' };
      if (I.cordPalpated) return { s:'支持', why:'破水後に拍動する索状物を触知する' };
      if (I.cordPalpated === false) return { s:'否定', why:'破水時の内診で臍帯を触知せず、胎児心拍に異常がない' };
      return { s:'保留', why:'破水後の内診所見が未入力', need:'内診（臍帯の触知）' };
    case '17': // 羊水混濁
      if (!I.rom) return { s:'保留', why:'未破水で判断できない（羊水混濁は破水して初めて確認できる）' };
      if (I.amnioticFluid === '混濁') return { s:'支持', why:'破水時に羊水の混濁を認める' };
      if (I.amnioticFluid === '清明') return { s:'否定', why:'破水時の羊水が乳白色で混濁を認めない' };
      return { s:'保留', why:'羊水性状が未入力', need:'羊水性状' };
    case '25': { // 胎児機能不全
      const lv = ctgLevel(I);
      if (lv == null) return { s:'保留', why:'分娩監視装置による評価が未実施', need:'CTG' };
      if (lv >= 3) return { s:'支持', why:`胎児心拍数波形レベル${lv}（レベル3以上を胎児機能不全と診断する）` };
      if (lv === 2) return { s:'注意', why:'レベル2（亜正常波形。連続監視を行い医師に報告する）' };
      return { s:'否定', why:'レベル1（正常波形）' };
    }
    case '26': { // 子宮内感染（Lencki基準）
      const sub = [];
      if (I.pulse != null && I.pulse >= 100) sub.push('母体頻脈100/分以上');
      if (I.uterineTenderness) sub.push('子宮の圧痛');
      if (I.foulDischarge) sub.push('腟分泌物・羊水の悪臭');
      if (I.wbc != null && I.wbc >= 15000) sub.push('母体白血球15,000/μL以上');
      if (I.temp != null && I.temp >= 38.0 && sub.length >= 1)
        return { s:'支持', why:`体温${I.temp}度（38.0度以上）＋${sub.join('・')}` };
      // 体温38.0度未満でも、頻脈・圧痛・悪臭・白血球15,000以上の4項目すべてを満たせば診断可能
      const ALL4 = ['母体頻脈100/分以上','子宮の圧痛','腟分泌物・羊水の悪臭','母体白血球15,000/μL以上'];
      if (ALL4.every(x => sub.includes(x)))
        return { s:'支持', why:`体温38.0度未満だが、${sub.join('・')}の4項目すべてを認める` };
      return { s:'保留', why:'5資料に否定基準の記載がないため否定不可。破水例では時間経過とともに警戒を保持する', denyImpossible:true };
    }
    default:
      return null;
  }
}

// CTG波形レベル（簡易：基線・細変動・一過性徐脈から）
function ctgLevel(I) {
  if (I.ctgLevel != null) return I.ctgLevel;
  if (I.fhrBaseline == null || !I.variability) return null;
  if (I.variability === '消失' || I.variability === 'サイナソイダル') return 4;
  const normalBase = I.fhrBaseline >= 110 && I.fhrBaseline <= 160;
  const dec = I.deceleration && I.deceleration !== 'なし';
  if (normalBase && I.variability === '正常' && !dec) return 1;
  if (!normalBase || dec || I.variability === '減少') return 2;
  return 1;
}

// 否定不可（5資料に否定基準がない）
const DENY_IMPOSSIBLE = ['23','24','26','28','29'];
// 保留固定（第8部）
const FORCED_HOLD = { '01':'分娩開始時点では有効性を判定できない（2時点の変化を要する）',
                      '02':'分娩開始時点では有効性を判定できない（2時点の変化を要する）' };

// ---------- STEP4 見通しの時刻計算 ----------
const DURATION = {
  0: { s1:[10,12], s2:[2,3], s3:[15/60,30/60], total:[11,15], s2Caution:2, s2Report:3 },
  1: { s1:[4,6],   s2:[1,1.5], s3:[10/60,20/60], total:[6,8],  s2Caution:1, s2Report:2 },
};
/* 表III-10（今日の助産 350ページ）。単位はg。[-2.0SD, -1.5SD, mean, +1.5SD, +2.0SD] */
const EFW_TABLE = {
  37: [2059, 2213, 2676, 3139, 3294],
  38: [2181, 2345, 2838, 3330, 3494],
  39: [2292, 2466, 2989, 3511, 3685],
  40: [2388, 2572, 3125, 3678, 3862],
  41: [2465, 2660, 3244, 3828, 4023],
};
/* 推定児体重が平均から何SD離れているかを返す。
   表は±1.5SDと±2.0SDしか持たないため、1SDあたりの幅を
   (+1.5SD − mean) ÷ 1.5 で出して割る。判定に使うのは±1.5SDの内外のみ。 */
function efwSDfromTable(efw, gaW){
  if(efw == null || efw === '' || gaW == null || gaW === '') return null;
  const row = EFW_TABLE[Number(gaW)];
  if(!row) return null;                       // 表にない週（42週など）は判定しない
  const mean = row[2], perSD = (row[3] - mean) / 1.5;
  if(!(perSD > 0)) return null;
  return Math.round(((Number(efw) - mean) / perSD) * 10) / 10;
}

function forecast(I) {
  const isPrimi = I.parity === 0 || (I.prevCS && !I.prevVaginal); // VBACは初産の数値を暫定適用
  const d = DURATION[isPrimi ? 0 : 1];
  const out = { basis: isPrimi ? (I.prevCS && !I.prevVaginal ? '初産の目安を暫定適用（VBAC。5資料に記載がないためAUの決定）' : '初産婦') : '経産婦', d };
  /* 分娩開始は常に陣痛発来時刻を起点とする（AU裁定 2026-08-04）。
     前期破水が先行していても破水時刻は起点にしない。
     資料の分娩開始の定義（規則的陣痛が周期10分以内または1時間6回）に合わせる。
     破水からの経過時間は感染の警戒に使うもので、分娩の時間軸とは別に扱う。 */
  const startISO = I.laborOnset;
  if (!startISO) {
    out.note = (I.onsetBasis === '前期破水')
      ? '前期破水が先行している。陣痛発来をもって分娩開始とするため、陣痛発来後に分娩開始時刻が確定する。目安の時間数のみ示す'
      : '陣痛発来後に分娩開始時刻が確定する。目安の時間数のみ示す';
    return out;
  }
  if (I.onsetBasis === '前期破水') out.basis += '／前期破水が先行するが、分娩開始は陣痛発来時刻から起算';
  const t0 = new Date(startISO);
  const fmt = h => { const t = new Date(t0.getTime() + h*3600000);
    return `${String(t.getMonth()+1)}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`; };
  const md = h => { const t = new Date(t0.getTime() + h*3600000); return `${t.getMonth()+1}/${t.getDate()}`; };
  const hm = h => { const t = new Date(t0.getTime() + h*3600000);
    return `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`; };
  const range = (h1,h2) => md(h1)===md(h2) ? `${md(h1)} ${hm(h1)} 〜 ${hm(h2)}` : `${fmt(h1)} 〜 ${fmt(h2)}`;
  out.onset = fmt(0);
  out.fullDilation = range(d.s1[0], d.s1[1]);
  /* 児娩出は第1期＋第2期の合計で出す。
     教科書7には「第1期10〜12時間／第2期2〜3時間」（合計12〜15時間）と
     「総所要時間11〜15時間」の両方の記載があり、資料内で食い違っている。
     同じ「児娩出」が画面上で2つの時刻になるのを避けるため、
     画面に出ている各期の数値と一致する合計を採る（AU裁定）。
     総所要時間11〜15時間は資料の記載として裁定リストに残す。 */
  out.delivery = range(d.s1[0]+d.s2[0], d.s1[1]+d.s2[1]);
  out.deliveryDur = [d.s1[0]+d.s2[0], d.s1[1]+d.s2[1]];
  let ep = I.epidural ? 1 : 0;
  out.s2Caution = `全開大から${d.s2Caution}時間`;
  out.s2Report = `全開大から${d.s2Report + ep}時間${ep ? '（硬膜外麻酔下のため+1時間）' : ''}`;
  return out;
}

// ---------- 実行 ----------
function assess(I, DB) {
  const gate = checkGate(I);
  const raised = {}; // no -> { factors:[], via:[] }
  const put = (no, factor, viaFrom) => {
    if (!raised[no]) raised[no] = { factors: [], via: [] };
    if (viaFrom) { if (!raised[no].via.includes(viaFrom)) raised[no].via.push(viaFrom); }
    else if (!raised[no].factors.includes(factor)) raised[no].factors.push(factor);
  };
  for (const r of RULES) {
    if (!r.test(I)) continue;
    r.raise.forEach(no => put(no, r.label));
    if (r.via) for (const [from, tos] of Object.entries(r.via)) {
      if (from === '06' && I.height != null && I.height > 150) continue; // 身長150cm超は06経由発火なし
      tos.forEach(no => put(no, r.label, from));
    }
  }
  NEVER_RAISE.forEach(no => delete raised[no]);

  const results = Object.keys(raised).sort().map(no => {
    const rec = DB.find(x => x.no === no);
    let st = FORCED_HOLD[no] ? { s:'保留', why:FORCED_HOLD[no] }
           : (DECIDABLE.includes(no) ? judgeState(no, I) : null);
    if (!st) st = { s:'保留', why:'入院時点では経過を追わないと判断できない（入院時の初期値）' };
    if (DENY_IMPOSSIBLE.includes(no)) st.denyImpossible = true;
    // 名称に含まれる内部の分類注釈（データモデル上のメモ）は臨床向けの表示・生成文には出さない
    const cleanName = rec.name.replace(/\(共通の上位レイヤー\)/, '').trim();
    return { ...rec, name: cleanName, state: st, factors: raised[no].factors, via: raised[no].via };
  });

  /* 「今回は当てはまらなかったもの」から ALWAYS_SUSPECT の6件を外す。
     23・24・26・28・29・30 は5資料に否定基準がない（否定不可）ため「除外」とは書けない。
     この6件は「常に頭に置くこと」に全例共通で出ており、そちらが正しい置き場所。 */
  /* 所見から否定できたものは「考えられる可能性」に残さない。
     リスク因子で立ったあと所見で否定できたのなら、それは除外できたということであり、
     経過観察と同じ場所に並べると除外駆動型の建て付けと矛盾する（ケース006で顕在化）。
     否定不可の6件は対象外。除外に移すときは否定できた理由も持たせる。 */
  const denied = results.filter(p => p.state.s === '否定' && !p.state.denyImpossible);
  const kept   = results.filter(p => !(p.state.s === '否定' && !p.state.denyImpossible));
  /* 「追わないと決めたもの」は性質が2つある。区別して理由を残す（AU裁定 2026-08-04）。
       ① 警戒因子がそもそも立たなかった   … この産婦に該当する因子がない
       ② 所見で否定できた（denied）      … 因子は立ったが、所見で否定できた
     ①の理由が空のままだと、パルト側で「理由なく除外された」ように見える。
     除外は永久ではなく、分娩中に所見が出れば立て直すため、
     なぜ今回は追わないのかを残しておく。 */
  const notRaisedWhy = (x) => {
    /* assess は取り出し口(M)より前に定義されているため、ここでは KW を直接引く。
       表示層ではなく判定層なので、この1か所は例外として扱う */
    const k = (KW || []).find(y => y.no === x.no);
    const note = k && k.factorsNote ? String(k.factorsNote) : '';
    /* マスター側に「入院時の画面には表示されない」と書かれているものは、
       因子の有無ではなく表示条件で出ていない。そう書く */
    if(/入院時の画面には表示されない/.test(note)){
      /* 因子の有無ではなく、表示条件で出ていないもの。
         注記の2行目以降に理由が書かれていればそれを添える
         （例「回旋異常の予知・予防は困難とされ、資料に記載がない」） */
      const rest = note.split('\n').slice(1).join(' ').trim();
      const fs0 = (k && Array.isArray(k.factors) ? k.factors : [])
        .map(f => (f && f.text) ? String(f.text) : '').filter(Boolean);
      const reason = rest || (fs0.length && /^なし/.test(fs0[0]) ? fs0[0] : '');
      return '入院時には立てない' + (reason ? `（${reason.replace(/^なし[(（]?/,'').replace(/[)）]$/,'')}）` : '');
    }
    if(/警戒因子の有無にかかわらず常時表示/.test(note))
      return '常に頭に置くことで扱う';
    /* 因子が1つも該当しなかった場合 */
    const fs = (k && Array.isArray(k.factors) ? k.factors : [])
      .map(f => (f && f.text) ? String(f.text) : '')
      .filter(t => t && !/^なし/.test(t));
    if(!fs.length) return '警戒因子が資料に記載されていないため、入院時には立てない';
    const head = fs.slice(0,3).map(t => t.split(/[(（]/)[0].trim()).join('／');
    return `この産婦に警戒因子が該当しない（${head}${fs.length>3?' ほか':''}）`;
  };

  const notRaised = DB.filter(x => !raised[x.no] && !ALWAYS_SUSPECT.includes(x.no))
                      .map(x => ({ no:x.no, name:x.name, why: notRaisedWhy(x) }))
                      .concat(denied.map(p => ({ no:p.no, name:p.name, why:p.state.why })))
                      .sort((a,b) => a.no.localeCompare(b.no));
  return { gate, raised: kept, notRaised, forecast: forecast(I) };
}

/* ============================================================
   パルトグラムへの引き継ぎ（AU裁定 2026-08-03 案A／実装 2026-08-04）
   ------------------------------------------------------------
   Firebaseプロジェクトは別（初期 bunben-79436 ／ soap bunben-soap）だが、
   公開先は同じ bunben-assessment.pages.dev で同一オリジン。
   したがって端末内の保管庫を両方から読み書きできる。
   手作業ゼロで、電波が入らない分娩室でも動く。

   渡すのは分娩中に変わらないものだけ。
   内診・CTG・バイタル・陣痛・出血は渡さない（パルトで毎回入力する）。

   cleared（追わないと決めたもの）も必ず渡す。
   除外駆動では除外は永久ではなく、分娩中に所見が出れば立て直すため。
   ※ルート側の変数名は notRaised。渡す形は cleared に合わせる
   ============================================================ */
const HANDOFF_KEY = 'bunben:handoff:v1';

function saveHandoff(){
  if(!R) return null;
  const pack = {
    version: 1,
    savedAt: new Date().toISOString(),
    caseName: I.caseName || '',
    input: I,
    /* 状態は画面と同じ言い方で渡す（支持→該当／保留→経過観察） */
    raised:  (R.raised   || []).map(x => ({ no:x.no, name:x.name,
                                            state:(ST_LABEL[x.state && x.state.s] || (x.state && x.state.s) || ''),
                                            why:(x.state && x.state.why) || '',
                                            factors:x.factors || [], via:x.via || [] })),
    cleared: (R.notRaised|| []).map(x => ({ no:x.no, name:x.name, why:x.why || '' })),
    verdict: (V && V.items ? V.items : []).map(x => ({ name:x.name,
                                            state:(V_LABEL[x.st] || x.st || '') })),
  };
  try{ localStorage.setItem(HANDOFF_KEY, JSON.stringify(pack)); }catch(e){}
  return pack;
}

/* 別の端末へ渡すためのコード。同じ端末なら上の保管庫だけで足りる */
function handoffCode(){
  const pack = saveHandoff();
  if(!pack){ alert('先にアセスメントを出してください'); return; }
  /* btoa は日本語を扱えないため、いったんUTF-8のバイト列に直す */
  const code = btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(pack))));
  navigator.clipboard.writeText(code)
    .then(()=>alert('引き継ぎコードをコピーしました。\nパルトグラムの新規産婦画面で貼り付けてください。'))
    .catch(()=>prompt('このコードをコピーしてください', code));
