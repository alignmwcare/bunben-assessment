function card(p){
  const st=p.state, rows=[], K=kw(p.no);
  const fac=p.factors.filter(Boolean).map(stripThreshold);
  if(fac.length||p.via.length) rows.push([L_FACTOR,
    esc(fac.join(' / ')||'—')+(p.via.length?` <span class="via">【経由:${p.via.join(',')}】</span>`:'')]);
  rows.push(['時期',esc((K&&K.when)||p.phase)]);
  rows.push(['判定の根拠',esc(st.why)]);
  if(st.need) rows.push(['要入力',`<span class="need">${esc(st.need)}</span>`]);
  rows.push(['観察項目', esc(((K&&K.watch)||[]).join(' ／ ') || p.watch)]);
  rows.push(['ケア', esc(((K&&K.do)||[]).join(' ／ ') || p.care)]);
  rows.push(['医師への報告', esc(((K&&K.report)||[]).map(c=>`${c.category}: ${c.items.join(' ／ ')}`).join('　') || p.redflag)]);
  return `<div class="p g-${URG_CLS[p.urgency]}">
    <div class="hd"><span class="no">${p.no}</span>
      <span class="st st-${st.s}">${dispST(st.s)}${st.denyImpossible?'・否定不可':''}</span></div>

    <div class="rows">${rows.map(([k,v])=>`<div class="r"><span class="k">${k}</span><span>${v}</span></div>`).join('')}</div></div>`;
}

function promptHead(mode){
  let s = `【絶対条件】\n`;
  s += `・以下に与えた判定結果だけを使って書く。判定を変更しない\n`;
  s += `・状態・緊急度・時刻はすでに確定している。書き換えない\n`;
  s += `・与えられていない病態・数値・基準を持ち込まない\n`;
  s += `・除外根拠が与えられていない項目は「保持」と書き、否定しない\n`;
  s += `・断定しない\n`;
  s += `・「追う可能性」「警戒因子」「立つ／立たない」「関門」は内部で使う言葉なので、本文に書かない。\n`;
  s += `  それぞれ「${L_POSS}」「${L_FACTOR}」「${L_POSS}に出る／出ない」「${L_GATE}」と書く\n\n`;
  s += `【モード】${mode==='student'?'学生モード（散文）':'臨床モード（キーワード）'}\n\n`;
  s += `【この産婦】\n`;
  s += `${I.parity===0?'初産婦':'経産婦（経産回数'+I.parity+'）'} ${I.age}歳 妊娠${I.gaWeeks}週${I.gaDays||0}日 ${I.presentation||''}\n`;
  s += `${I.rom?'破水あり':'未破水'}${I.inductionPlanned?' ／ 誘発・促進の予定あり':''}${I.epidural?' ／ 硬膜外麻酔の予定':''}\n`;
  if(I.efw!=null){
    const gw = (I.efwGaW!=null) ? `（${I.efwGaW}週${I.efwGaD!=null?I.efwGaD+'日':''}時点の計測値）` : '（計測週数の入力なし）';
    s += `推定児体重 ${I.efw}g ${gw}。最終計測値をそのまま用い、日数外挿・増加計算は行わない\n`;
  }
  if(I.births && I.births.length){
    s += `\n【分娩歴】\n`;
    I.births.forEach(b=>{
      const parts=[];
      if(b.gaW!=null) parts.push(`${b.gaW}週${b.gaD!=null?b.gaD+'日':''}`);
      if(b.mode) parts.push(b.mode);
      if(b.sex||b.weight!=null) parts.push(`${b.sex||''}${b.weight!=null?b.weight+'g':''}`);
      if(b.minutes!=null) parts.push(`所要時間${Math.floor(b.minutes/60)}時間${b.minutes%60}分`);
      const flg=[];
      if(b.minutes!=null && b.minutes<=240) flg.push('急産（4時間以内）に当たる');
      if(b.weight!=null && b.weight>=3800) flg.push('3,800g以上');
      s += `・第${b.i}子：${parts.join('、')}${flg.length?`　→ ${flg.join('・')}`:''}\n`;
    });
  }
  const rec = recordOnly();
  if(rec.length) s += `\n【記録用（判定には用いていない。必要なら本文で触れてよいが、これを根拠に判断しない）】\n${rec.join('／')}\n`;
  s += `\n`;
  return s;
}

// 判定に使っていないが記録として持っている値
function recordOnly(){
  const out=[];
  const put=(l,v,u)=>{ if(v!=null&&v!=='') out.push(`${l} ${v}${u||''}`); };
  put('SpO2',I.spo2,'%'); put('呼吸数',I.resp,'回/分');
  put('PT',I.pt,'%'); put('APTT',I.aptt,'秒'); put('Fibg',I.fibg,'mg/dL');
  put('AC',I.ac,'cm'); put('FL',I.fl,'cm');
  put('矢状縫合',I.sagittalSuture); put('大小泉門',I.fontanelle);
  put('腹部触診の強さ',I.ucStrength);
  if(I.gravida!=null) out.push(`G${I.gravida}${I.paraN!=null?`/P${I.paraN}`:''}${I.abortions?`/流早産${I.abortions}`:''}`);
  const comp=[['dm','糖尿病・妊娠糖尿病'],['heartDisease','心疾患'],['thyroid','甲状腺疾患'],
    ['anemiaDx','貧血'],['coagulopathy','血液凝固異常'],['renal','腎疾患'],['compOther','その他の合併症'],
    ['ptl','切迫早産'],['fgr','FGR'],['lga','LGA'],['alcohol','飲酒']];
  comp.forEach(([k,l])=>{ if(I[k]) out.push(l); });
  return out;
}

/* ---------- ① 経腟分娩の可否 ---------- */
/* 因子ラベル（基準値の説明）に、入力された実測値を差し込む。
   実測値が取得できない場合はラベルをそのまま使う（値の創作はしない）。 */
function factorWithValue(label){
  if(/^貧血（Hb/.test(label)){
    const bits=[]; if(I.hb!=null) bits.push(`Hb ${I.hb}g/dL`); if(I.ht!=null) bits.push(`Ht ${I.ht}%`);

/* ---------- ② 分娩経過の予測 ---------- */
function promptForecast(mode){
  const f=R.forecast;
  let s = promptHead(mode);
  s += `【出力するもの】分娩経過の予測（動的な進行）。経腟分娩の可否はすでに別に出力済みなので、ここでは繰り返さない。\n`;
  s += `可否が断定できていなくても、経過の予測は行う。可否と経過は別のものである。\n\n`;
  s += `【見通し（計算済み。この時刻をそのまま使う）】\n基準 ${f.basis}\n`;
  if(f.note) s += `分娩開始 ${f.note}\n`;
  else s += `分娩開始 ${f.onset}\n全開大の目安 ${f.fullDilation}\n児娩出の目安 ${f.delivery}\n`;
  /* 所要時間の目安も渡す。渡さないと、AIが各期を足し算して「15時間」のような
     材料にない数値を書き、検算で止まって出し直しになる（AU裁定 2026-08-04）。
     計算としては正しいので、最初から材料として渡してしまう */
  if(f.d){
    /* 1時間未満は分で渡す。「0.25〜0.5時間」と渡すと、AIは当然「15〜30分」と
       書き直し、その数値が材料にないため検算で止まる（ケース006で顕在化）。
       人が書く形で渡しておく（AU裁定 2026-08-04） */
    const dur = (a,b) => (b < 1)
      ? `${Math.round(a*60)}〜${Math.round(b*60)}分`
      : `${a}〜${b}時間`;
    s += `所要時間の目安 第1期 ${dur(f.d.s1[0],f.d.s1[1])} ／ 第2期 ${dur(f.d.s2[0],f.d.s2[1])}`
       + ` ／ 第3期 ${dur(f.d.s3[0],f.d.s3[1])}`
       + `${f.d.total?` ／ 全体 ${dur(f.d.total[0],f.d.total[1])}`:''}\n`;
  }
  s += `第2期 注意ライン ${f.s2Caution} ／ 要報告ライン ${f.s2Report}\n\n`;
  s += `【${L_POSS}】\n`;
  for(const p of R.raised.slice().sort(byUrgency)){
    s += `\n― ${p.no} ${p.name}\n  緊急度: ${p.urgency}\n`;
    s += `  状態: ${dispST(p.state.s)}${p.state.denyImpossible?'（5資料に否定基準なし＝否定不可）':''}\n`;
    s += `  状態の理由: ${p.state.why}\n`;
    s += `  ${L_FACTOR}: ${p.factors.map(factorWithValue).join(' / ')||'—'}${p.via.length?` 【経由:${p.via.join(',')}】`:''}\n`;
    s += `  いつ: ${p.phase}\n  そうなる引き金: ${p.trigger}\n  観察点: ${p.watch}\n  ケア: ${p.care}\n  報告ライン: ${p.redflag}\n`;
    if(p.state.need) s += `  まだ確認できていないこと: ${p.state.need}\n`;
  }
  if(!R.raised.length) s += `（${L_POSS_EMPTY}）\n`;
  /* 期ごとの割り振りをこちらで済ませて渡す。
     これまでは可能性を平らに並べ、各項目の「いつ」からAIに組み立てさせていた。
     件数が増えると期の割り振りを取り違え、第3期が空になる崩れが繰り返し出たため、

      s += `${k}（${g.length}件）${g.length
        ? g.map(p=>p.name.split(/[(（]/)[0]).join('／')
        : 'なし。「この時期に見ていくものはない。経過観察でよい。」と1行だけ書く'}\n`;
    });
    s += `上の名前は、その期の本文に1つ残らず出す。数が多くても省略しない。\n`;
    s += `書き終えたら、各期の本文に名前がそろっているかを数えて確かめる。\n`;

    s += `渡した材料の裏側に触れない\n`;
    s += `・【記録用】の存在や扱いに言及しない。「判定には用いていない」「これを根拠に予測しない」等は書かない（原則2）\n`;
    s += `・材料に値があればその値を使い、無ければその項目に触れない。使う・使わないの理由を本文で説明しない\n\n`;
    s += `各期の書き出し\n`;
    s += `・「全開大に達した時点から」「胎盤娩出後」のような時期の説明から始めない。所見・因子から書き出す（原則1）\n`;
    s += `・二重否定を使わない。誤「起こりえない状況とは言えない」／正「起こりうる状態にある」\n\n`;
    s += `「次に見るもの」欄は箇条書きのまま維持する。この欄には原則4（次にすることまで書く）を適用しない\n\n`;
    s += `各段落は 情報 → 基準との照合 → 結論 → 判断できない場合はその理由 → 次に見るもの（箇条書き）の順。\n`;
    s += `所見の値を1文の中で繰り返さない。読点で終わる未完成な文にしない。1〜2文を目安に句点で区切る。\n`;
    s += `散文で書く。箇条書きは「次に見るもの」だけに使う。可能性の番号は本文に出さない。名称で書く。\n`;
    s += `一読で理解できる平易な臨床言語を使う。断定しない。\n`;
  }else{
    s += `見通しは画面に出ているので繰り返さない。${L_POSS}から書く。\n`;
    s += `緊急度の見出しで区切る。■■■母体の生命 ／ ■■■児の生命 ／ ■■要報告 ／ ■注意・経過観察\n`;
    s += `1可能性につき4行。散文にしない。\n`;
    s += `  名称 【状態】\n  ・${L_FACTOR} …\n  ・いつ …\n  ・見る …\n  ・する …（入院時に行うことがある場合のみ）\n`;
  }
  return s;
}

const PARTS = [
  { id:'verdict',  label:'経腟分娩の可否', build:promptVerdict, modes:['student'] },
  { id:'forecast', label:'分娩経過の予測', build:promptForecast, modes:['student','clinical'] },
];
// 経腟分娩の可否は学生モードのみに出す（臨床では入院時に問う場面がない）
// 臨床モードはプログラムだけで組む（追加ルール13）。AIを通さない
function partsFor(mode){ return mode==='clinical' ? [] : PARTS.filter(p=>p.modes.includes(mode)); }

function renderPrompt(){
  let h='';
  for(const m of ['clinical','student'])
    for(const pt of partsFor(m)){
      const t = pt.build(m);
      const id = `pr_${m}_${pt.id}`;
      h += `<section><h2>${m==='student'?'学生':'臨床'}モード ／ ${pt.label}<span class="n">${t.length.toLocaleString()}字</span>
        <span class="cp" data-copy="${id}">コピー</span></h2><pre class="pr" id="${id}">${esc(t)}</pre></section>`;
    }
  return h;
}

/* ============ 模擬生成（APIを叩かない） ============ */
/* 項目ごとに専用の文を組む。項目名を主語に置かず（原則1）、
   否定できない項目には次にすること（原則4）を必ず添える。
   資料にある確認方法（内診・超音波・血圧測定等）だけを使う。 */
const VERDICT_COMPOSERS = {

  '正期産の確認': x=>{
    if(x.st==='未測定') return `まだ妊娠週数を確認していないため、正期産かどうか判定できない。分娩予定日と本日の妊娠週数を確認する。`;
    if(x.st==='否定') return `${x.found}であり、正期産である。`;
    return `${x.found}であり、正期産（37週0日〜41週6日）の範囲を外れている。`;
  },

  '骨産道と児頭の関係': x=>{
    const sub = x.sub||[];
    const known = sub.filter(s=>s.dir!=='未測定');
    const un = sub.filter(s=>s.dir==='未測定');
    const susp = sub.filter(s=>s.dir==='疑い');
    const negOnly = known.filter(s=>s.dir==='否定').map(s=>s.label).join('、');
    const facts = known.map(s=>s.label).join('、');
    if(x.st==='否定') return `${facts}。骨産道と児頭の関係に、経腟分娩を妨げる所見を認めない。`;
    if(x.st==='保持'){
      const need = un.length ? `分娩経過のなかで${un.map(s=>s.label.replace('（stationから判定）','')).join('・')}を確認する。` : `分娩経過のなかで児頭の下降の進み方から確認する。`;
      const suspLabel = susp.map(s=>s.label).join('・');
      return `${negOnly?negOnly+'。':''}${suspLabel}があり、児頭がまだ下降していないため、骨産道と児頭の関係はまだ判断できない。${need}`;
    }
    return `身長・児頭の下降・BPDのいずれも確認できておらず、骨産道と児頭の関係を評価する材料がない。入院時の内診と超音波で確認する。`;
  },

  '頸管の熟化': x=>{
    const sub = x.sub||[];
    const known = sub.filter(s=>!s.un);
    const facts = known.map(s=>s.label).join('、');
    if(x.st==='否定') return `${facts}。頸管の熟化が進んでいることを確認できる。`;
    const slow = sub.filter(s=>!s.un && !s.ok).map(s=>s.label);
    const un = sub.filter(s=>s.un).map(s=>s.label);
    const need = un.length ? `分娩経過のなかで${un.join('・')}の変化を確認する。` : `分娩経過のなかで頸管所見の変化を確認する。`;
    return `${facts?facts+'。':''}入院時点の1回の内診では頸管の熟化をまだ判断できない${slow.length?`（${slow.join('・')}）`:''}。${need}`;
  },

  '軟産道の奇形・瘢痕・腫瘍': x=>{
    if(x.st==='否定') return `腟狭窄・腟中隔・頸管筋腫・縫縮や裂傷の瘢痕はいずれもなく、軟産道の奇形・瘢痕・腫瘍は否定できる。`;
    return `${x.found}があるため、軟産道の通過障害は否定できない。分娩進行にあわせて娩出の様子から確認する。`;
  },

  '感染スクリーニング': x=>{
    if(x.st==='未測定') return `まだGBS・HTLV-1・HBV・HCVの結果を確認していないため判定できない。感染症スクリーニングの結果を確認する。`;
    if(!x.msg || x.msg==='経腟分娩を妨げる感染の所見を認めない') return `GBS・HTLV-1・HBV・HCVはいずれも陰性であり、経腟分娩を妨げる感染の所見を認めない。`;
    return `${x.msg.replace(/。$/,'')}ため、経腟分娩は妨げられない。`;
  },

  '妊娠高血圧症候群': x=>{
    if(x.st==='未測定') return `まだ入院時の血圧を確認していないため判定できない。血圧を測定する。`;
    if(x.st==='該当') return `血圧${x.found}を確認でき、140/90mmHg以上であるため、妊娠高血圧症候群を認める。直ちに医師へ報告する。`;
    return `血圧${x.found}を確認でき、140/90mmHg未満のため、妊娠高血圧症候群は否定できる。`;
  },

  '帝王切開既往(TOLAC／子宮破裂)': x=>{
    if(x.st==='該当') return `帝王切開の既往がありTOLACとなるため、子宮破裂を分娩終了まで警戒する。所要時間は初産の数値を暫定的に用いる。`;
    return `帝王切開の既往はなく、子宮破裂の観点から経腟分娩を妨げる所見はない。`;
  },

  '胎位(骨盤位・横位)': x=>{
    if(x.st==='未測定') return `まだ胎位を確認していないため判定できない。触診・超音波・心音の位置で確認する。`;
    if(x.st==='該当') return `${x.found}であり、頭位以外の胎位に当たる。直ちに医師へ報告する${x.found==='横位'?'。横位では経腟分娩はできない':''}。`;
    return `頭位を確認できたため、骨盤位・横位は否定できる。`;
  },

  '巨大児': x=>{
    if(x.st==='未測定') return `まだ推定児体重を確認していないため判定できない。超音波で推定児体重を測定する。`;
    if(x.st==='該当') return `${x.found}を確認でき、4000g以上または発育の偏り（±1.5SD）を外れているため、要精査に当たる。`;
    const sdNote = /SDでの評価はしていない/.test(x.msg);
    return `${x.found}を確認でき、4000g未満のため、巨大児は否定できる。${sdNote?'発育曲線上の偏りまでは確認できていない。':''}`;
  },

  '単胎／多胎': x=>{
    if(x.st==='未測定') return `まだ単胎か多胎かを確認していないため判定できない。超音波で確認する。`;
    if(x.st==='該当') return `多胎であり、単胎を前提とした基準は当てはまらない。`;
    return `単胎を確認できたため、多胎は否定できる。`;
  },

  '前置胎盤・低置胎盤': x=>{
    if(x.st==='未測定') return `まだ超音波で胎盤付着位置を確認していないため判定できない。超音波で確認する。`;
    if(x.st==='該当') return `${x.found}であり、内子宮口を覆っている。経腟分娩はできない。`;
    if(x.st==='保持') return `${x.found}で内子宮口は覆っていないが、内子宮口から2cm以内の低置胎盤に当たるため、出血への警戒は解かない。`;
    return `超音波で胎盤付着位置を確認でき、内子宮口を覆っていないため、前置胎盤・低置胎盤は否定できる。`;
  },

  '臍帯の位置': x=>{
    if(x.st==='該当') return `内診で拍動する索状物を触知しており、臍帯を触知する。直ちに医師へ報告する。`;
    if(x.st==='否定') return `内診で臍帯を触れず、現時点で先進部より前に臍帯はない。`;
    return `臍帯の有無をまだ内診で確認していないため、臍帯の位置を判断できない。分娩の進行にあわせて内診で確認する。`;
  },

  '羊水量(過多／過少)': x=>{
    if(x.st==='未測定') return `羊水ポケット・AFIの数値までは確認できておらず、触診だけでは過多・過少を判断できないが、経腟分娩の可否そのものを妨げる材料ではない。必要に応じて超音波でポケット・AFIを測定する。`;
    if(x.st==='該当') return `${x.found}を確認でき、基準を外れているため、${/過多/.test(x.msg)?'羊水過多':'羊水過少'}を認める。`;
    return `${x.found}を確認でき、過多・過少の基準は外れているため、羊水量の異常は否定できる。`;
  },
};

/* found(所見)とmsg(判断)を自然文に合成する。項目別の合成が無い場合の保険。
   msgがfoundの内容をすでに言い直している場合は、foundの重複分を落とす。 */
const METHOD_ITEMS = ['胎位(骨盤位・横位)','単胎／多胎'];
const NO_METHOD_FOUND = new Set([
  '頭位という記載はあるが、まだ超音波などで確認していない',
  'まだ超音波などで確認していない',
]);
function verdictSentence(x){
  if(VERDICT_COMPOSERS[x.name]) return VERDICT_COMPOSERS[x.name](x);
  const nm = x.name;
  if(!x.msg) return `${x.found||dispV(x.st)}である。`;
  let lead = '';
  if(x.found){
    const toks = x.found.split(/[／・]/).map(t=>t.trim()).filter(Boolean);
    const novel = toks.filter(t=>t && !x.msg.includes(t));
    if(novel.length) lead = novel.join('・')+'であり、';
  }
  let s = `${lead}${x.msg}`;
  if(!/[。］)]$/.test(s)) s += '。';
  return s;
}
function mockText(mode, part){
  if(part.id==='verdict'){
    if(mode==='student'){
      const secs=['前提','母体・骨産道','母体・軟産道','母体・その他','胎児','付属物'];
      return secs.map(sc=>{
        const g=V.items.filter(x=>x.sec===sc); if(!g.length) return '';
        return `${sc}\n　${g.map(verdictSentence).join('')}`;
      }).filter(Boolean).join('\n\n') + `\n\n${V.conclusion}`;
    }
    const tri=['母体生命に関わる','児生命に関わる','要報告(分娩様式に関わる)','経過観察'];
    let t=`正期産:妊娠${I.gaWeeks}週${I.gaDays||0}日(37w0d〜41w6d)\n`;
    for(const tr of tri){
      const g=V.items.filter(x=>x.tri===tr); if(!g.length) continue;
      t+=`\n【${tr}】\n`+g.map(x=>`・${x.name} … ${x.found||'—'} → ${dispV(x.st)}`).join('\n')+'\n';
    }
    t+=`\n―――\n判定:${V.conclusion}`;
    if(V.redflags.length) t+=`\n即報告:${V.redflags.join(' ／ ')}`;
    return t;
  }
  if(!R.raised.length) return L_POSS_EMPTY+'。';
  if(mode==='student'){
    return STAGES.map(st=>{
      const g = R.raised.filter(p=>inStage(p,st.key)).slice().sort(byUrgency);
      if(!g.length) return `${st.label}\n　（この期に渡すものはない）`;
      /* 期の見出しの直下に、その期で必ず触れるものを名前だけ並べる。
         材料が期のブロックの中に散らばっていると、件数が増えたときに
         書き落としが起きる（第3期が空になる崩れが繰り返し出た）。
         最初に名前の一覧を見せてから、中身を続ける。 */
      const roster = `　この期で必ず触れるもの ${g.length}件：`
        + g.map(p=>p.name.split(/[(（]/)[0]).join('／');
      return `${st.label}\n${roster}\n` + g.map(p=>{
        const w = splitWatch(p.no).item;
        // 観察項目と、その末尾に付く注意書きを同じ点に同居させない。注意書きは行末に分けて置く
        const lines = w.length
          ? w.map(x=>{
              const m = x.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
              return m ? `　・${m[1]}　※${m[2]}` : `　・${x}`;
            })
          : [`　・${String(p.watch).replace(/[、,]\s*$/,'')}`];
        const facArr = p.factors.filter(Boolean).map(f=>factorWithValue(f).replace(/あり$/,''));
        const fac = facArr.join('・')||null;
        const lead = fac ? `${fac}があるため、` : '';
        return `　${lead}${p.name}を経過観察する。${p.state.why}。\n　次に見るもの\n${lines.join('\n')}`;
      }).join('\n\n');
    }).join('\n\n');
  }
  let t='';
  for(const u of URG_ORDER){
    const g=R.raised.filter(p=>p.urgency===u); if(!g.length) continue;
    t+=`\n${URG_MARK[u]}${u}\n`;
    t+=g.map(p=>`${p.name} 【${dispST(p.state.s)}】\n・${L_FACTOR} ${p.factors.join(' / ')||'—'}\n・いつ ${p.phase}\n・見る ${String(p.watch).slice(0,50)}\n・報告 ${String(p.redflag).slice(0,50)}`).join('\n\n')+'\n';
  }
  return t.trim();
}

/* ============ 生成（Cloudflare Worker 経由） ============ */
async function generate(mode, part){
  const key = `${mode}:${part.id}`;
  GEN[key]='loading'; delete CHK[key]; renderOut();
  if(MOCK){
    await new Promise(r=>setTimeout(r,120));
    GEN[key] = mockText(mode, part) + '\n\n——— 模擬出力。APIは叩いていない ———';
    if(part.id==='forecast') CHK[key] = checkAll(GEN[key], part, mode);
    renderOut(); return;
  }
  const ask = async (extra)=>{
    bumpApiCount(extra ? 'retry' : part.id);
    /* 誰が叩いたかをWorkerに伝える。
       これがないとWorker側で承認・期限・回数を確かめられない。
       認証を切っているあいだ（AUTH_ON=false）はトークンがないため、
       Worker側で401になる。画面調整は模擬モードで行うこと。 */
    let idToken = null;
    try{
      const u = window.__fb && window.__fb.auth && window.__fb.auth.currentUser;
      if(u) idToken = await u.getIdToken();
    }catch(e){}
    const res = await fetch(API_ENDPOINT,{
      method:'POST',
      headers: Object.assign({'Content-Type':'application/json'},
                             idToken ? {'Authorization':'Bearer '+idToken} : {}),
      body: JSON.stringify({ model:MODEL, max_tokens:6000,
        messages:[{role:'user',content:part.build(mode) + (extra||'')}] })
    });
    /* 今月の回数と上限。Workerが毎回返す */
    const used = res.headers.get('X-Usage-Used'), lim = res.headers.get('X-Usage-Limit');
    if(used && lim) renderUsage(Number(used), Number(lim));
    if(!res.ok){
      /* APIは400などのとき、理由を本文で返す。
         「HTTP 400」だけでは原因が分からないので、返ってきた内容も画面に出す。 */
      let detail = '';
      try{
        const raw = await res.text();
        try{ const j = JSON.parse(raw); detail = (j.error && (j.error.message||j.error.type)) || raw; }
        catch(e){ detail = raw; }
      }catch(e){}
      /* 401・403・429はWorkerが出した文言をそのまま見せる。
         「HTTP 403」では、承認待ちなのか期限切れなのか上限なのかが分からない */
      if(res.status===401||res.status===403||res.status===429)
        throw new Error(detail || `HTTP ${res.status}`);
      throw new Error(`HTTP ${res.status}${detail?`　${String(detail).slice(0,300)}`:''}`);
    }
    const data = await res.json();
    return (data.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');
  };
  try{
    GEN[key] = (await ask()) || '（空の応答）';
    if(part.id === 'forecast'){
      let ng = checkAll(GEN[key], part, mode);
      /* 1回目の結果をここで入れておく。
         出し直しには数秒かかり、そのあいだ CHK が空だと画面が「検算していない」になる。
         その状態で書き出すと、検算が動いていないように見えてしまう。 */
      CHK[key] = ng;
      /* 検算に引っかかったら1回だけ出し直す（AU裁定）。
         第3期が空になる崩れが繰り返し起きており、プロンプトの縛りだけでは安定しないため。
         2回目も引っかかった場合は、そのまま出して注意書きを付ける。
         出し直しはAPIをもう1回叩くので、回数は1回に限る。 */
      if(ng.length){
        RETRY[key] = true; renderOut();   // 「出し直しています」を先に出す
        const fix = `\n\n━━━ 直してほしい点 ━━━\n`
          + `いま書いた文章に次の問題があった。同じ形式のまま、この点だけ直して全文を書き直す。\n`
          + ng.map(x=>`・${x}`).join('\n')
          + `\n渡していない可能性・数値・病名を持ち出さない。渡した期の内容は必ずその期に書く。\n`;
        try{
          const again = await ask(fix);
          if(again){
            const ng2 = checkAll(again, part, mode);
            // 直って（または減って）いれば採用する。増えていたら最初の文章を残す
            if(ng2.length < ng.length){ GEN[key] = again; ng = ng2; }
          }
        }catch(e){ /* 出し直しに失敗しても最初の文章を残す */ }
      }
      CHK[key] = ng;
    }
  }catch(e){ GEN[key] = {error:String(e.message||e)}; }
  delete RETRY[key];
  renderOut();
}
/* ============ 検算 ============
   AIは文章の組み立てだけを担当し、根拠はエンジンの出力に接地させる約束になっている。
   その約束が守られたかを機械で照合する。ここでは第1弾として
   「各期に渡した可能性が、その期の本文に1回は出ているか」を見る。
   引っかかっても生成は止めない。どこが確認要りかを示すほうが教育的、という裁定による。 */
const CHECK_STAGES = ['第1期','第2期','第3期','第4期'];
function verifyForecast(txt){
  if(typeof txt !== 'string' || !R || !R.raised) return [];
  const ng = [];
  // 本文を期の見出しで切り分ける
  const idx = CHECK_STAGES.map(name=>{
    const re = new RegExp('^\\s*'+name+'(（[^）]*）)?\\s*$','m');
    const m = re.exec(txt);
    return { name, at: m ? m.index : -1 };
  });
  CHECK_STAGES.forEach((name, i)=>{
    const here = idx[i].at;
    if(here < 0) return;                       // 見出し自体が無い場合は別の問題として扱わない
    const nexts = idx.slice(i+1).map(x=>x.at).filter(x=>x>here);
    const end = nexts.length ? Math.min(...nexts) : txt.length;
    const body = txt.slice(here, end);
    const want = R.raised.filter(p=>inStage(p, name));
    want.forEach(p=>{
      // 括弧の中は言い換えられることがあるため、括弧の前までで照合する
      /* 名称は文章のなかで言い換えられる。「急産・急速分娩(進行が速すぎる)」を
         「急産の既往」「急速な進行」と書くのは正しい書き方であり、丸ごと一致は求めない。
         括弧の前までを「・」で割り、どれか1つでも本文に出ていればよいものとする。 */
      const cores = p.name.split(/[(（]/)[0].split('・').map(x=>x.trim()).filter(Boolean);
      if(cores.length && !cores.some(c=>body.indexOf(c) >= 0))
        ng.push(`${name}に${p.name}が出ていない`);
    });
    if(want.length && /見ていくものはない/.test(body))
      ng.push(`${name}に渡したものがあるのに「見ていくものはない」と書かれている`);
  });
  return ng;
}

/* 検算② 本文に出る病名が、その期に渡した材料のなかにあるか。
   30の可能性の名称から語を取り出して照合する。括弧の中も語として使う。
   短い呼び方（血腫・早剝など）は名称から機械的には取り出せないため、別名として持つ。
   AUが語を足したいときはここに書き足す。 */
const DZ_ALIAS = { '09':['血腫'], '23':['子宮破裂'], '24':['早剝'], '29':['DIC'],
                   '30':['危機的出血'], '26':['絨毛膜羊膜炎'],
                   '10':['回旋異常','反屈'], '11':['回旋異常'], '12':['回旋異常'],
                   '13':['進入異常'], '14':['進入異常'] };
/* 照合から外す語。
   病名の括弧の中には「(娩出期)」「(破水前)」のように、その病名固有ではなく
   時期や場面を指すだけの語が入っている。これを照合語にすると、
   「第2期（娩出期）」と普通に書いただけで引っかかる（ケース006で顕在化）。
   一般名詞として広く使われる語も同様に外す（AU裁定 2026-08-04）。 */
const DZ_STOPWORDS = new Set([
  '娩出期','開口期','後産期','破水前','破水後','分娩開始時','全開大前','全開大後',
  '第1期','第2期','第3期','第4期','分娩後','妊娠中','分娩中',
  '進行が速すぎる','頸管熟化不良','正常波形',
]);
function dzTokens(x){
  const t = [];
  String(x.name).replace(/[（(]([^）)]*)[）)]/g, (m,inner)=>{ t.push(...inner.split('・')); return '｜'; })
    .split(/[・｜]/).forEach(y=>t.push(y));
  (DZ_ALIAS[x.no]||[]).forEach(y=>t.push(y));
  return t.map(y=>y.trim()).filter(y=>y.length>=2 && !DZ_STOPWORDS.has(y));
}
/* その期に渡した材料。
   経由してきた可能性（08は19を経由して立つ）の名称も材料に含める。
   「急産・急速分娩に続発しうる高度軟産道裂傷」は、なぜ08が立ったかの説明であり
   19を持ち出しているのではないため、これを誤りとしない。 */
function stageMaterial(passed){
  const viaNames = [];
  passed.forEach(p=>(p.via||[]).forEach(no=>{
    const x = M.db(no); if(x) viaNames.push(x.name);
  }));
  return passed.map(p=>[p.name,p.trigger,p.state.why,p.watch,p.care,p.redflag,
    (p.factors||[]).join(' ')].join(' ')).concat(viaNames).join(' ');
}
/* 期の見出しで本文を切り分ける。第1期〜第4期のほか、
   「分娩期を通して警戒するもの」「まだ評価できていないもの」も対象にする。
   この2つは分娩期全体の話なので、材料はすべての立った可能性とする。 */
function splitSections(txt){
  const heads = CHECK_STAGES.concat(['分娩期を通して警戒するもの','まだ評価できていないもの']);
  const found = heads.map(name=>{
    const m = new RegExp('^\\s*'+name+'(（[^）]*）)?\\s*$','m').exec(txt);
    return { name, at: m ? m.index : -1 };
  }).filter(x=>x.at >= 0).sort((a,b)=>a.at-b.at);
  return found.map((x,i)=>({
    name: x.name,
    body: txt.slice(x.at, i+1 < found.length ? found[i+1].at : txt.length)
  }));
}
function verifyNames(txt){
  if(typeof txt !== 'string' || !R || !R.raised) return [];
  const ng = [];
  splitSections(txt).forEach(sec=>{
    /* その期に渡した可能性に加えて、前の期までに渡したものも材料に含める。
       「第1期から続いており、この時期も評価を継続する」と書くのは正しい書き方であり、
       その期に渡していない病名を新たに持ち出したのとは違う（ケース006で顕在化）。 */
    const idx = CHECK_STAGES.indexOf(sec.name);
    const upto = idx >= 0 ? CHECK_STAGES.slice(0, idx + 1) : CHECK_STAGES;
    const passed = CHECK_STAGES.includes(sec.name)
      ? R.raised.filter(p => upto.some(st => inStage(p, st)))
      : R.raised;                    // 全体の節は、立った可能性すべてを材料とする
    const mat = stageMaterial(passed);
    const seen = new Set();
    M.dbAll().forEach(x=>{
      if(passed.some(p=>p.no===x.no)) return;
      dzTokens(x).forEach(tok=>{
        if(seen.has(tok)) return;
        if(sec.body.indexOf(tok) >= 0 && mat.indexOf(tok) < 0){
          seen.add(tok);
          ng.push(`${sec.name}に渡していない「${tok}」（${x.no} ${x.name}）が出ている`);
        }
      });
    });
  });
  return ng;
}

/* 検算③ 状態語。
   内部の語（支持・保留・保持）は画面に出さない取り決めになっている。
   また、立った可能性を否定する書き方になっていないかを見る。 */
const BAN_STATE = ['支持','保留','保持'];
function verifyState(txt){
  if(typeof txt !== 'string' || !R || !R.raised) return [];
  const ng = [];
  // 【今回は当てはまらなかったもの】の一覧は「除外」を正しく使う場所なので対象から外す
  const cut = txt.indexOf('見通し');
  const body = cut > 0 ? txt.slice(cut) : txt;
  BAN_STATE.forEach(wd=>{
    if(body.indexOf(wd) >= 0)
      ng.push(`内部の語「${wd}」が本文に出ている（該当・経過観察・クリア・要確認を使う）`);
  });
  const sentences = body.split(/(?<=。)/);
  const said = new Set();
  R.raised.forEach(p=>{
    const cores = p.name.split(/[(（]/)[0].split('・').map(x=>x.trim()).filter(x=>x.length>=2);
    sentences.forEach(sen=>{
      if(!cores.some(c=>sen.indexOf(c) >= 0)) return;
      /* 「否定できない」は正しい書き方であり、否定していない。
         「否定でき」だけを見ると打ち消しを拾ってしまうため、
         打ち消しの形（できない・されない・し(て)いない）を先に除いてから判定する。 */
      const affirmDeny = /(除外(?!でき(ない|ず))|否定できる|否定した|該当しない|問題ない)/.test(sen)
        && !/(否定できない|否定しきれない|除外できない|除外しきれない|否定でき(ず|ない))/.test(sen);
      if(affirmDeny && !said.has(p.no)){
        said.add(p.no);
        ng.push(`「${p.name}」は経過観察として渡したのに、否定する書き方になっている文がある`);
      }
    });
  });
  return ng;
}

/* 検算① 数値。
   本文に出る数値が、渡した材料のなかにあるか。単位まで含めて照合する。
   材料に無い数値は、AIがどこかから持ってきた数値ということになる。 */
const NUM_UNITS = 'cm/時|mmHg|bpm|kg|mL|ml|cm|g|L|週|日|時間|分|秒|%|度|回|人|指';
function numTokens(t){
  const re = new RegExp('(\\d+(?:\\.\\d+)?)\\s*(' + NUM_UNITS + ')?', 'g');
  const out = [];
  let m; while((m = re.exec(String(t)))) out.push(m[1] + (m[2] || ''));
  return out;
}
function verifyNumbers(txt, material){
  if(typeof txt !== 'string' || typeof material !== 'string') return [];
  /* 日付は材料が「7/29」、本文が「7月29日」と書き方が違う。
     どちらの形でも照合できるよう、材料に両方の形を持たせる。 */
  const dated = material.replace(/(\d+)\/(\d+)(?!\d)/g, '$1月$2日');
  const mat = (material + '｜' + dated).replace(/\s+/g, '');
  const ng = [], said = new Set();
  numTokens(txt).forEach(tok=>{
    if(said.has(tok)) return;
    if(mat.indexOf(tok) < 0){ said.add(tok); ng.push(`本文の「${tok}」は渡した材料にない数値`); }
  });
  return ng;
}

/* 検算をまとめて走らせる。①〜④のうち①②③④。引っかかっても生成は止めない。 */
function checkAll(txt, part, mode){
  let mat = '';
  try{ mat = part.build(mode); }catch(e){ mat = ''; }
  return verifyForecast(txt)
    .concat(verifyNames(txt))
    .concat(verifyState(txt))
    .concat(verifyNumbers(txt, mat));
}

function generateAll(mode){ partsFor(mode).forEach(pt=>{ if(!GEN[`${mode}:${pt.id}`]) generate(mode,pt); }); }

/* ============ 入力の確認 ============ */
function reviewLines(){
  const secs = [];
  for(const t of TABS){
    const rows = [];
    for(const g of t.groups){
      if(g.if && !g.if(I)) continue;
      if(g.yn && I[g.yn[0]]!=='あり'){
        const v = I[g.yn[0]];
        rows.push([g.h, v ? (g.ynLabel?(v==='あり'?g.ynLabel[0]:g.ynLabel[1]):v) : '未入力']);
        continue;
      }
      const vals = [];
      for(const f of g.fields){
        const [k,lb,ty,x,o] = f;
        if(o&&o.if&&!o.if(I)) continue;
        if(ty==='b'){ if(I[k]) vals.push(lb); continue; }
        if(ty==='wd'){ const [k1,k2]=(o&&o.keys)||[], [u1,u2]=(o&&o.units)||['週','日'];
          if(I[k1]!=null||I[k2]!=null) vals.push(`${lb||g.h} ${I[k1]??'?'}${u1}${I[k2]??0}${u2}`); continue; }
        if(ty==='age'){ if(I.age!=null) vals.push(`${lb} ${I.age}歳`); continue; }
        if(ty==='bp'){ if(I.sbp!=null||I.dbp!=null) vals.push(`${lb} ${I.sbp??'?'}/${I.dbp??'?'}mmHg`); continue; }
        if(I[k]!=null&&I[k]!=='') vals.push(`${lb} ${I[k]}${(ty==='n'&&x)?x:''}`);
      }
      if(vals.length) rows.push([g.h, vals.join('　')]);
    }
    if(rows.length) secs.push([t.label, rows]);
  }
  return secs;
}
function renderReview(){
  const miss = missingRequired();
  let h = '';
  if(miss.length) h += `<section><h2>未入力<span class="n">${miss.length}件</span></h2>
    <div class="gate"><ul>${miss.map(x=>`<li>${esc(x[0])}</li>`).join('')}</ul></div></section>`;
  for(const [label,rows] of reviewLines()){
    h += `<section><h2>${label}</h2><div class="forecast"><dl>${
      rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd class="jp">${esc(v)}</dd>`).join('')}</dl></div></section>`;
  }
  document.getElementById('reviewOut').innerHTML = h || '<section><div class="tiny">まだ何も入力されていません</div></section>';
}
function reviewText(){
  return reviewLines().map(([label,rows])=>
    `【${label}】\n`+rows.map(([k,v])=>`  ${k}：${v}`).join('\n')).join('\n\n');
}

/* ============ 入力の保存（この端末のブラウザに残す） ============ */
const SAVE_KEY = 'bunben.input.v1';

/* ============ APIを叩いた回数 ============
   費用がどこで増えているかを見えるようにする。
   1回のアセスメントで可否1回・経過予測1回、検算に引っかかると出し直しでもう1回。
   端末のなかだけに保存する。 */
const API_COUNT_KEY = 'bunben.apicount.v1';
function loadApiCount(){
  try{ return JSON.parse(localStorage.getItem(API_COUNT_KEY)) || {}; }catch(e){ return {}; }
}
function bumpApiCount(kind){          // kind: 'verdict' | 'forecast' | 'retry'
  const c = loadApiCount();
  const day = new Date().toISOString().slice(0,10);
  if(c.day !== day){ c.day = day; c.today = {}; }
  c.today = c.today || {};
  c.total = c.total || {};
  c.today[kind] = (c.today[kind]||0) + 1;
  c.total[kind] = (c.total[kind]||0) + 1;
  try{ localStorage.setItem(API_COUNT_KEY, JSON.stringify(c)); }catch(e){}
  renderApiCount();
}
function sumCount(o){ return Object.values(o||{}).reduce((a,b)=>a+b,0); }
function apiCountText(){
  const c = loadApiCount();
  const t = c.today||{}, a = c.total||{};
  if(!sumCount(a)) return '';
  const part = o => `可否${o.verdict||0}・経過${o.forecast||0}${o.retry?`・出し直し${o.retry}`:''}`;
  return `APIを叩いた回数　今日 ${sumCount(t)}回（${part(t)}）／累計 ${sumCount(a)}回（${part(a)}）`;
}
function renderApiCount(){
  const el = document.getElementById('apiCount');
  if(el) el.textContent = apiCountText() + (USAGE ? `／今月 ${USAGE.used}回（上限 ${USAGE.limit}回）` : '');
}
/* Workerが返す今月の回数と上限。端末内の数え（上）と違い、こちらが実際の基準。
   端末を替えても、開発者ツールで消しても、この数字は変わらない。 */
let USAGE = null;
function renderUsage(used, limit){
  USAGE = { used, limit };
  renderApiCount();
}
let saveTimer = null;
function saveInput(){

function loadInput(){

/* 端末に保存できるかを確かめる。

/* ============ 記録（履歴） ============
   その場の入力とは別に、確定したアセスメントをスナップショットとして残す。
   端末のローカル保存のみ。サーバーには送らない。 */
const HIST_KEY = 'bunben.records.v1';
const HIST_MAX = 100;

function loadRecords(){
  try{
    const raw = localStorage.getItem(HIST_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveRecords(arr){
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(arr.slice(0, HIST_MAX))); }catch(e){}
}

function saveRecord(){
  if(!R || !V) return; // アセスメントを一度も実行していない状態では記録しない
  const now = new Date();
  const rec = {
    id: 'r' + now.getTime(),
    savedAt: now.toISOString(),
    caseName: I.caseName || '',
    gaText: (I.gaWeeks!=null) ? `${I.gaWeeks}週${I.gaDays||0}日` : '',
    who: I.parity===0 ? '初産婦' : (I.parity!=null ? `経産婦（分娩${I.parity}回）` : ''),
    phase: labourPhase() || '',
    signCount: (V.redflags||[]).length,
    snapshot: JSON.parse(JSON.stringify(I)),
  };
  const arr = loadRecords();
  arr.unshift(rec);
  saveRecords(arr);
  return rec;
}

function deleteRecord(id){
  saveRecords(loadRecords().filter(r=>r.id!==id));
}

function loadRecord(id){
  const rec = loadRecords().find(r=>r.id===id);
  if(!rec) return false;
  I = JSON.parse(JSON.stringify(rec.snapshot));
  syncForm(); afterEdit();
  return true;
}

function renderHistory(){
  const arr = loadRecords();
  document.getElementById('histCount').textContent = arr.length ? `${arr.length}件` : '';
  /* 「記録を全部消す」は画面のいちばん上に置く（AU指示）。
     記録が1件も無いときは押せないようにする。2回押しで確定する。 */
  const ca = document.getElementById('histClearAll');
  if(ca){
    ca.style.display = arr.length ? '' : 'none';
    ca.textContent = '記録を全部消す';
    ca.onclick = ()=>{
      if(ca.dataset.arm !== '1'){
        ca.dataset.arm = '1';
        ca.textContent = 'もう一度押すと全部消える';
        setTimeout(()=>{ ca.dataset.arm=''; ca.textContent='記録を全部消す'; }, 4000);
        return;
      }
      ca.dataset.arm = '';
      saveRecords([]);
      renderHistory();
    };
  }
  if(!arr.length){
    document.getElementById('histOut').innerHTML =
      `<div class="card"><div class="fn">まだ記録がない。結果画面の「記録する」を押すと、ここに残る。この端末だけに保存され、他の端末やサーバーには送られない。</div></div>`;
    return;
  }
  document.getElementById('histOut').innerHTML = arr.map(r=>{
    const t = new Date(r.savedAt);
    const ts = `${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    return `<div class="card histcard" data-hid="${r.id}">
      <div class="histrow">
        <div class="histmain">
          <div class="histid">${esc(r.caseName)||'（呼称未入力）'}<span class="sep">・</span><span class="histts">${ts}</span></div>
          <div class="histph">${esc(r.phase)||'—'}</div>
          <div class="fn">${esc(r.who)}${r.gaText?'　'+esc(r.gaText):''}${r.signCount?`　<span class="u-maternal">いま出ているサイン ${r.signCount}件</span>`:''}</div>
        </div>
        <button class="histdel" data-hid="${r.id}" title="この記録を消す">🗑</button>
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.histcard').forEach(c=>c.addEventListener('click',e=>{
    if(e.target.closest('.histdel')) return;
    if(loadRecord(c.dataset.hid)){ goResult(); }
  }));
  document.querySelectorAll('.histdel').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    if(!confirm('この記録を消します。よろしいですか')) return;
    deleteRecord(b.dataset.hid);
    renderHistory();
  }));
}

function buildNav(){
  const N=[['scInput','入力',ICO.home],['scResult','アセスメント',ICO.doc],
    ['scHistory','履歴',ICO.clock],['scReview','確認',ICO.gear]];
  const el=document.getElementById('navtabs');

/* 出力全文をプレーンテキストで取り出す。
   折りたたみの開閉に関わらず中身を含める（開いているかで内容が変わらないこと）。 */
/* 画面の内容をプレーンテキストで書き出す（開発・レビュー用）。
   畳んでいるブロック・カードの中身も、開いていなくても書き出す。
   畳んでいるものは行末に（畳）を付ける。階層は半角2文字の字下げで表す。 */
function outputAsText(){
  const out = document.getElementById('out');
  if(!out) return '';
  const L = [];
  const flat = t => String(t||'').replace(/\s+/g,' ').trim();
  const put = (d,t)=>{ t=flat(t); if(t) L.push('  '.repeat(d)+t); };

  // ラベルと値が分かれている要素は1行にまとめる
  const PAIR = [['.idfld','.idlbl','.idval'],['.fnd','.fk2','.fv2'],
                ['.vr','.vk',null],['.prow','.pk',null],['.gdrow','.gdk','.gdv']];

  const walk = (el, d) => {
    for(const n of el.children){
      if(n.tagName==='BUTTON' || n.classList.contains('genbar')) continue;

      const pair = PAIR.find(([sel])=>n.matches(sel));
      if(pair){
        const k = n.querySelector(pair[1]);
        const v = pair[2] ? n.querySelector(pair[2]) : null;
        const key = k?flat(k.textContent):'';
        const ul = n.querySelector('ul');
        if(ul){   // 「この時期にすること」など、値が箇条書きのもの
          put(d, key);
          for(const li of ul.children) put(d+1, li.textContent);
          continue;
        }
        /* リスク因子欄は「当てはまるもの」と畳んだ「当てはまらないもの」を持つ。
           textContent をそのまま取ると区切りなしでつながるため、分けて出す。 */
        const more = n.querySelector('.rfmore');
        if(more){
          const hitEl = n.querySelector('.rfhit');
          const restEl = more.querySelector('.rfrest');
          put(d, `${key} ${hitEl?flat(hitEl.textContent):''}`.trim());
          if(restEl) put(d+1, `当てはまらないもの：${flat(restEl.textContent)}`);
          continue;
        }
        const val = v?flat(v.textContent):flat(n.textContent).replace(key,'').trim();
        put(d, key&&val ? `${key} ${val}` : (key||val));
        continue;
      }
      // 折りたたみ：見出しに（畳）を付け、閉じていても中身をたどる
      if(n.tagName==='DETAILS'){
        const sm = n.querySelector(':scope > summary');
        put(d, (sm?flat(sm.textContent):'') + (n.open?'':'（畳）'));
        for(const c of n.children){ if(c.tagName!=='SUMMARY') walk(c, d+1); }
        continue;
      }
      // セクション見出しは [] で囲んで階層の頭に置く
      if(n.matches('.sech')){ L.push(''); put(d, '['+flat(n.textContent)+']'); continue; }
      if(n.matches('.tnm, .gclbl, .sublbl, .stsub, .cat, h2, h4')){
        put(d, n.textContent); continue;
      }
      if(n.matches('.gcsub')){ put(d, n.textContent); continue; }
      if(n.matches('.gcnone')){ put(d+1, n.textContent); continue; }
      if(n.matches('.gen')){
        const raw = n.dataset.raw!=null ? n.dataset.raw : n.innerText;
        String(raw).split('\n').forEach(x=>put(d, x));
        continue;
      }
      if(n.matches('.fitem')){
        const nm=n.querySelector('.fnm'), tm=n.querySelector('.ft'), du=n.querySelector('.fa');
        put(d, `${flat(nm&&nm.textContent)} ${flat(tm&&tm.textContent)}${du?'（'+flat(du.textContent)+'）':''}`);
        continue;
      }
      if(n.matches('.sgrow')){
        const sg=n.querySelector('.sgn'), dx=n.querySelector('.dxline'), tg=n.querySelector('.now-tag');
        put(d, `${flat(sg&&sg.textContent)} ${flat(dx&&dx.textContent)}${tg?' ［即報告］':''}`);
        continue;
      }
      if(n.tagName==='LI'){ put(d, n.textContent); continue; }
      if(n.tagName==='UL'){ for(const li of n.children) put(d, li.textContent); continue; }
      if(n.matches('.gclist')){ for(const li of n.children) put(d+1, li.textContent); continue; }
      if(n.matches('.sec, .card, .tli, .pbox, .gcbox, .subbox, .tl, .rboxes, .rbox, .body, .signlist, .findgrid, .row, .stage'))
        { walk(n, n.matches('.sec, .tl, .rboxes, .signlist, .findgrid, .row, .body') ? d : d+1); continue; }
      if(n.children.length===0){ put(d, n.textContent); continue; }
      walk(n, d);
    }
  };
  walk(out, 1);

  const t = I.admitTime ? new Date(I.admitTime) : new Date();
  const ts = `${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')} `
           + `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  const modeName = (view==='student') ? '学生モード' : '臨床モード';
  const apiName  = MOCK ? '模擬モード' : '実API';
  return `${I.caseName||''} ${ts}\n${modeName}／${apiName}\n`
       + L.join('\n').replace(/\n{3,}/g,'\n\n');
}

    try{
      await signInWithEmailAndPassword(auth, $('au_mail').value.trim(), $('au_pw').value);
    }catch(e){
      $('au_err').textContent =
        (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password'
          || e.code === 'auth/user-not-found')
          ? 'メールアドレスかパスワードが違います'
          : 'ログインできませんでした（' + e.code + '）';
    }
  };
  $('au_reset').onclick = async () => {
    const mail = $('au_mail').value.trim();
    if(!mail){ $('au_err').textContent = 'メールアドレスを入れてから押してください'; return; }
    try{
      await sendPasswordResetEmail(auth, mail);
      $('au_err').textContent = '再設定のメールを送りました';
    }catch(e){ $('au_err').textContent = '送れませんでした（' + e.code + '）'; }
  };

  /* ---------- 新規登録 ---------- */
  $('su_go').onclick = async () => {
    const mail   = $('su_mail').value.trim();
    const pw     = $('su_pw').value;
    const name   = $('su_name').value.trim();
    const org    = $('su_org').value.trim();
    const course = $('su_course').value;
    const err = m => { $('su_err').textContent = m; };
    err('');
    if(!name)            return err('お名前を入れてください');
    if(pw.length < 6)    return err('パスワードは6文字以上にしてください');
    if(role === 'student' && !org)    return err('学校名を入れてください');
    if(role === 'student' && !course) return err('課程を選んでください');

    try{
      const c = await createUserWithEmailAndPassword(auth, mail, pw);
      const rec = {
        displayName: name, email: mail, role, org,
        approved: false, expires: null,
        apiCount: {}, createdAt: serverTimestamp()
      };
      if(role === 'student'){
        rec.course    = course;
        rec.gradLimit = gradLimit(course);
      }
      await setDoc(doc(db, 'users', c.user.uid), rec);
      try{ await sendEmailVerification(c.user); }catch(e){}
      /* 承認する人に知らせる。失敗しても登録は通す */
      try{
        await fetch(SIGNUP_NOTIFY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name, mail, role, org, course: course || null,
            gradLimit: rec.gradLimit ? ymd(rec.gradLimit) : null
          })
        });
      }catch(e){}
    }catch(e){
      err(e.code === 'auth/email-already-in-use'
        ? 'このメールアドレスは登録済みです'
        : e.code === 'auth/invalid-email'
        ? 'メールアドレスの形式を確認してください'
        : '登録できませんでした（' + e.code + '）');
    }
  };

  /* ---------- 承認と期限を見る ---------- */
  onAuthStateChanged(auth, async user => {
    if(!user){ lock(); show('login'); return; }
    let u = {}, hasDoc = false;
    try{
      const s = await getDoc(doc(db, 'users', user.uid));
      hasDoc = s.exists();
      u = hasDoc ? s.data() : {};
    }catch(e){
      lock(); show('wait');
      $('au_waitmsg').textContent = '情報を読み込めませんでした。\n通信を確かめてから開き直してください。';
      return;
    }
    const toDate = t => (t && t.toDate) ? t.toDate() : (t ? new Date(t) : null);
    const now = new Date();
    const ex  = toDate(u.expires);
    const gl  = toDate(u.gradLimit);

    /* 記録が消えている人。管理画面から削除するとこの状態になる。
       Firebase Auth のアカウントだけが残るため、ログインはできるのに
       承認待ち画面から出られない。同じ文面にすると永久に待たせることになる */
    if(!hasDoc){
      lock(); show('wait');
      $('au_waitmsg').textContent =
        'ご登録の情報が見つかりませんでした。\n'
        + 'お手数ですが、ご連絡いただくかログアウトして登録し直してください。';
      return;
    }
    /* 見送りにした人。承認待ちと同じ文面にすると、いつまでも待たせることになる。
       やり直しの窓口は残しておく */
    if(u.rejected === true){
      lock(); show('wait');
      $('au_waitmsg').textContent =
        'このアカウントはご利用の対象になっておりません。\n'
        + 'お心当たりがない場合は、お手数ですがご連絡ください。';
      return;
    }
    if(u.approved !== true){
      lock(); show('wait');
      $('au_waitmsg').textContent =
        'ご登録ありがとうございます。\nいま確認をしています。\n'
        + '使えるようになりましたら、ご登録のメールにお知らせします。';
      return;
    }
    if(ex && ex < now){
      lock(); show('wait');
      $('au_waitmsg').textContent =
        'ご利用の期限が切れています。\n続けてお使いになる場合はご連絡ください。';
      return;
    }
    if(gl && gl < now){
      lock(); show('wait');
      $('au_waitmsg').textContent =
        '学生としてのご利用期間が終わりました。\n'
        + '続けてお使いになる場合は、あらためてご連絡ください。';
      return;
    }
    window.__me = { uid: user.uid, ...u };
    unlock();
    initAdmin(u.role === 'admin');
  });

/* ============================================================
   管理画面
   ここに入れるのは role が admin の人だけ。画面でも隠すが、
   実際に止めているのは firestore.rules の isAdmin()。
   画面を隠すのは誤操作を防ぐためであって、これが守りではない。
   ============================================================ */
const NOTIFY_APPROVED = "https://bunben-api.align-mw-care.workers.dev/notify-approved";

let adRows = [];        // 読み込んだ users の一覧
let adTab  = 'wait';
let adTerm = {};        // uid ごとに選んでいる期限（Date）

function initAdmin(isAdmin){
  const btn = $('hAdmin');
  if(!btn) return;
  btn.style.display = isAdmin ? '' : 'none';
  if(!isAdmin) return;
  if(btn.dataset.ready) return;
  btn.dataset.ready = '1';

  btn.onclick = () => { $('scAdmin').classList.add('on'); adLoad(); };
  $('ad_close').onclick  = () => $('scAdmin').classList.remove('on');
  $('ad_reload').onclick = () => adLoad();
  $('ad_tabs').querySelectorAll('.adtab').forEach(t => t.onclick = () => {
    adTab = t.dataset.t;
    $('ad_tabs').querySelectorAll('.adtab').forEach(x =>
      x.classList.toggle('on', x.dataset.t === adTab));
    adRender();
  });
}

const adDate = t => (t && t.toDate) ? t.toDate() : (t ? new Date(t) : null);
const adYmd  = d => d ? ymd(d) : '—';

/* 期限切れか。expires と gradLimit のどちらかが過ぎていれば切れている */
function adOver(r){
  const now = new Date();
  const ex = adDate(r.expires), gl = adDate(r.gradLimit);
  return (ex && ex < now) || (gl && gl < now);
}
function adBucket(r){
  if(r.rejected === true)  return 'rej';
  if(r.approved !== true)  return 'wait';
  return adOver(r) ? 'over' : 'live';
}

async function adLoad(){
  const { db, collection, getDocs } = window.__fbAdmin;
  $('ad_list').innerHTML = '<div class="adempty">読み込んでいます…</div>';
  try{
    const snap = await getDocs(collection(db, 'users'));
    adRows = [];
    snap.forEach(d => adRows.push({ uid: d.id, ...d.data() }));
    /* 登録の古い順。承認待ちは待たせた人から見えたほうがよい */
    adRows.sort((a,b) => {
      const x = adDate(a.createdAt), y = adDate(b.createdAt);
      return (x ? x.getTime() : 0) - (y ? y.getTime() : 0);
    });
    adRender();
  }catch(e){
    $('ad_list').innerHTML =
      `<div class="adempty">読み込めませんでした（${esc(e.code || e.message || '')}）<br>`
      + `管理者以外はこの一覧を読めません。</div>`;
  }
}

/* タブの件数だけ更新する。
   操作の直後に一覧を作り直すと、そのカードに出した結果の文が消える。
   Worker が未実装のあいだ「メールを手で送ってください」の警告が
   読まれないまま消えることになるため、一覧は作り直さない。 */
function adCounts(){
  const n = { wait:0, live:0, over:0, rej:0 };
  adRows.forEach(r => n[adBucket(r)]++);
  $('ad_n_wait').textContent = n.wait ? n.wait : '';
  $('ad_n_live').textContent = n.live ? n.live : '';
  $('ad_n_over').textContent = n.over ? n.over : '';
  $('ad_n_rej').textContent  = n.rej  ? n.rej  : '';
}

function adRender(){
  adCounts();
  const rows = adRows.filter(r => adBucket(r) === adTab);
  if(!rows.length){
    const msg = { wait:'承認待ちの方はいません', live:'利用中の方はいません',
                  over:'期限切れの方はいません', rej:'見送りにした方はいません' };
    $('ad_list').innerHTML = `<div class="adempty">${msg[adTab]}</div>`;
    return;
  }
  $('ad_list').innerHTML = rows.map(adCard).join('');
  adBind();
}

const ROLE_JA = { midwife:'助産師', student:'助産学生', admin:'管理者' };
const COURSE_JA = { '1y':'1年課程', '2y-1':'2年課程 1年目', '2y-2':'2年課程 2年目' };
/* 見えるモードの個別設定。未設定なら役割どおり（既定） */
const MODES_JA = { clinical:'臨床のみ', student:'学生のみ', both:'両方' };
const ROLE_MODES_JA = { midwife:'臨床のみ', student:'学生のみ', admin:'両方' };

function adCard(r){
  const gl = adDate(r.gradLimit), ex = adDate(r.expires);
  const over = adOver(r);
  let h = `<div class="adcard" data-uid="${esc(r.uid)}">
    <div class="adname">${esc(r.displayName || '（お名前なし）')}
      <span class="adtag">${ROLE_JA[r.role] || esc(r.role || '')}</span>
      ${over ? '<span class="adtag warn">期限切れ</span>' : ''}</div>
    <div class="admail">${esc(r.email || '')}</div>
    <div class="adrow">
      <span>所属 <b>${esc(r.org || '—')}</b></span>
      ${r.course ? `<span>課程 <b>${COURSE_JA[r.course] || esc(r.course)}</b></span>` : ''}
      <span>登録 <b>${adYmd(adDate(r.createdAt))}</b></span>
    </div>
    <div class="adrow">
      <span>期限 <b>${ex ? adYmd(ex) : '（なし）'}</b></span>
      ${gl ? `<span>卒業予定 <b>${adYmd(gl)}</b></span>` : ''}
      <span>今月の上限 <b>${Number.isFinite(r.apiLimit) ? r.apiLimit + '回' : '（既定）'}</b></span>
      <span>見えるモード <b>${MODES_JA[r.modes] || `既定（${ROLE_MODES_JA[r.role] || '両方'}）`}</b></span>
    </div>`;

  /* 管理者は自分では止められない。自分を止めると誰も承認できなくなる */
  if(r.role === 'admin'){
    h += `<div class="adnote">管理者のため、この画面からは変更できません</div></div>`;
    return h;
  }

  const bucket = adBucket(r);
  if(bucket === 'wait' || bucket === 'over'){
    h += adTermPicker(r);
  }
  h += `<div class="adacts">`;
  if(bucket === 'wait'){
    h += `<button class="adbtn main" data-do="approve">承認する</button>
          <button class="adbtn danger" data-do="reject">見送る</button>`;
  } else if(bucket === 'live'){
    h += `<button class="adbtn" data-do="extend">期限を変える</button>
          <button class="adbtn danger" data-do="suspend">利用を止める</button>`;
  } else if(bucket === 'over'){
    h += `<button class="adbtn main" data-do="approve">期限を延ばす</button>`;
  } else if(bucket === 'rej'){
    h += `<button class="adbtn" data-do="unreject">承認待ちに戻す</button>`;
  }
  /* 削除は承認待ちと見送りだけ。利用中の人を消せる位置には置かない */
  if(bucket === 'wait' || bucket === 'rej'){
    h += `<button class="adbtn danger" data-do="delete">削除する</button>`;
  }
  if(r.role === 'midwife' || r.role === 'student'){
    h += `<button class="adbtn" data-do="role">${
      r.role === 'student' ? '助産師にする' : '助産学生にする'}</button>`;
  }
  h += `<button class="adbtn" data-do="limit">今月の上限を変える</button>`;
  h += `<button class="adbtn" data-do="modes">見えるモードを変える</button>`;
  h += `</div><div class="adnote" data-msg></div></div>`;
  return h;
}

/* 期限の選び方。ボタンで足すか、日付を直接入れるか */
function adTermPicker(r){
  return `<div class="adterm" data-term>
      <button data-m="1">1か月</button>
      <button data-m="3">3か月</button>
      <button data-m="6">6か月</button>
      <button data-m="12">1年</button>
      <input type="date" data-date>
    </div>`;
}

function adAddMonths(m){
  const d = new Date();
  d.setMonth(d.getMonth() + m);
  d.setHours(23, 59, 59, 0);
  return d;
}

function adBind(){
  document.querySelectorAll('#ad_list .adcard').forEach(card => {
    const uid = card.dataset.uid;
    const row = adRows.find(x => x.uid === uid);
    const msg = card.querySelector('[data-msg]');

    card.querySelectorAll('[data-term] button').forEach(b => b.onclick = () => {
      card.querySelectorAll('[data-term] button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      adTerm[uid] = adAddMonths(Number(b.dataset.m));
      const inp = card.querySelector('[data-date]');
      if(inp) inp.value = ymd(adTerm[uid]);
      adTermNote(card, row, msg);
    });
    const inp = card.querySelector('[data-date]');
    if(inp) inp.onchange = () => {
      if(!inp.value) return;
      card.querySelectorAll('[data-term] button').forEach(x => x.classList.remove('on'));
      const d = new Date(inp.value + 'T23:59:59');
      adTerm[uid] = d;
      adTermNote(card, row, msg);
    };

    card.querySelectorAll('[data-do]').forEach(b => b.onclick = () => adDo(b.dataset.do, row, card, msg, b));
  });
}

/* 卒業予定日を超える指定は、その日まで丸める。
   在学中の利用を前提にしているため、卒業後まで伸ばさない */
function adClamp(row, d){
  const gl = adDate(row.gradLimit);
  if(gl && d > gl) return { date: gl, clamped: true };
  return { date: d, clamped: false };
}
function adTermNote(card, row, msg){
  const d = adTerm[row.uid];
  if(!d) return;
  const c = adClamp(row, d);
  msg.className = 'adnote' + (c.clamped ? ' warn' : '');
  msg.textContent = c.clamped
    ? `卒業予定日を超えるため ${ymd(c.date)} までにします`
    : `${ymd(c.date)} までになります`;
}

async function adDo(what, row, card, msg, btn){
  const { db, doc, updateDoc, deleteDoc } = window.__fbAdmin;
  const ref = doc(db, 'users', row.uid);
  const set = m => { msg.className = 'adnote'; msg.textContent = m; };
  const bad = m => { msg.className = 'adnote warn'; msg.textContent = m; };

  try{
    btn.disabled = true;
    if(what === 'approve'){
      const picked = adTerm[row.uid];
      if(!picked){ bad('先に期限を選んでください'); btn.disabled = false; return; }
      const c = adClamp(row, picked);
      await updateDoc(ref, { approved: true, rejected: false, expires: c.date });
      row.approved = true; row.rejected = false; row.expires = c.date;
      set(`承認しました（${ymd(c.date)} まで）`);
      await adNotify(row, c.date, msg);
    }
    else if(what === 'extend'){
      /* 利用中の人の期限を変えるときも、いったん承認待ちと同じ選び方をする */
      if(!card.querySelector('[data-term]')){
        card.querySelector('.adacts').insertAdjacentHTML('beforebegin', adTermPicker(row));
        adBind();
        set('新しい期限を選んでください');
        btn.disabled = false;
        return;
      }
      const picked = adTerm[row.uid];
      if(!picked){ bad('新しい期限を選んでください'); btn.disabled = false; return; }
      const c = adClamp(row, picked);
      await updateDoc(ref, { expires: c.date });
      row.expires = c.date;
      set(`期限を ${ymd(c.date)} にしました`);
    }
    else if(what === 'reject'){
      if(!confirm(`${row.displayName || ''} さんを見送りにしますか。\nあとで承認待ちに戻せます。`)){
        btn.disabled = false; return;
      }
      await updateDoc(ref, { rejected: true, approved: false });
      row.rejected = true; row.approved = false;
      set('見送りにしました');
    }
    else if(what === 'unreject'){
      await updateDoc(ref, { rejected: false });
      row.rejected = false;
      set('承認待ちに戻しました');
    }
    else if(what === 'suspend'){
      if(!confirm(`${row.displayName || ''} さんの利用を止めますか。\n承認待ちに戻ります。`)){
        btn.disabled = false; return;
      }
      await updateDoc(ref, { approved: false });
      row.approved = false;
      set('利用を止めました');
    }
    else if(what === 'limit'){
      const cur = Number.isFinite(row.apiLimit) ? row.apiLimit : '';
      const v = prompt('今月のAPI回数の上限を入れてください。\n空にすると既定に戻ります。', cur);
      if(v === null){ btn.disabled = false; return; }
      const t = v.trim();
      if(t === ''){
        await updateDoc(ref, { apiLimit: null });
        row.apiLimit = null;
        set('上限を既定に戻しました');
      }else{
        const n = Number(t);
        if(!Number.isFinite(n) || n < 0 || !Number.isInteger(n)){
          bad('0以上の整数で入れてください'); btn.disabled = false; return;
        }
        await updateDoc(ref, { apiLimit: n });
        row.apiLimit = n;
        set(`今月の上限を ${n}回 にしました`);
      }
    }
    else if(what === 'modes'){
      /* 未設定なら役割どおり。例外の人にだけ入れる */
      const cur = MODES_JA[row.modes] || '既定';
      const v = prompt(
        '見えるモードを選んでください。\n\n'
        + '  1  既定（役割どおり）\n'
        + '  2  臨床のみ\n'
        + '  3  学生のみ\n'
        + '  4  両方（助産師教員など）\n\n'
        + `いまは「${cur}」です。番号を入れてください。`, '');
      if(v === null){ btn.disabled = false; return; }
      const map = { '1':null, '2':'clinical', '3':'student', '4':'both' };
      const t = v.trim();
      if(!(t in map)){ bad('1〜4の番号で入れてください'); btn.disabled = false; return; }
      await updateDoc(ref, { modes: map[t] });
      row.modes = map[t];
      set(map[t] ? `見えるモードを「${MODES_JA[map[t]]}」にしました`
                 : '見えるモードを既定（役割どおり）に戻しました');
    }
    else if(what === 'delete'){
      /* 消せるのは users の記録だけ。Firebase Auth のアカウントは残る。
         ブラウザからは他人のアカウントを消せないため（自分のぶんしか消せない）、
         Firebase Console で消してもらう必要がある。
         消し忘れると、その人はログインできるのに使えない状態で固まる */
      if(!confirm(
        `${row.displayName || ''} さんの記録を削除しますか。\n\n`
        + 'この操作は取り消せません。\n'
        + 'ログインのアカウントは残るため、Firebase Console からも\n'
        + '削除してください（手順はこのあと画面に出ます）。')) {
        btn.disabled = false; return;
      }
      await deleteDoc(ref);
      adRows = adRows.filter(x => x.uid !== row.uid);
      msg.className = 'adnote warn';
      msg.textContent =
        `削除しました。Firebase Console → Authentication → Users から `
        + `${row.email} も削除してください。残したままだと、この方は`
        + `ログインできるのに使えない状態になります。`;
      adCounts();
      card.querySelectorAll('button, input').forEach(x => x.disabled = true);
      card.style.opacity = '.72';
      return;   // 下の共通処理（カードを閉じる）は済ませてあるので抜ける
    }
    else if(what === 'role'){
      const next = row.role === 'student' ? 'midwife' : 'student';
      /* 助産師にするときは、学生としての期限（卒業予定日）を外す。
         残したままだと、助産師なのに卒業予定日で切れる */
      const patch = { role: next };
      if(next === 'midwife'){ patch.gradLimit = null; patch.course = null; }
      await updateDoc(ref, patch);
      Object.assign(row, patch);
      if(next === 'student')
        bad(`${ROLE_JA[next]} にしました／卒業予定日は入っていません。期限を入れ直してください`);
      else
        set(`${ROLE_JA[next]} にしました`);
    }
    /* 済んだカードは操作できないようにし、文はそのまま残す。
       一覧への反映はタブの切り替えか「読み込み直す」で行う */
    adCounts();
    card.querySelectorAll('button, input').forEach(x => x.disabled = true);
    card.style.opacity = '.72';
  }catch(e){
    bad(`変更できませんでした（${e.code || e.message || ''}）`);
    btn.disabled = false;
  }
}

/* 承認したことを本人に知らせる。Worker 側の /notify-approved が受ける。
   まだ用意できていないあいだは必ず失敗するため、そのときは
   「手で送ってください」と画面に出す。取りこぼしを作らないため。 */
async function adNotify(row, until, msg){
  try{
    const u = window.__fb && window.__fb.auth && window.__fb.auth.currentUser;
    const idToken = u ? await u.getIdToken() : null;
    const res = await fetch(NOTIFY_APPROVED, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' },
                             idToken ? { 'Authorization': 'Bearer ' + idToken } : {}),
      body: JSON.stringify({
        mail: row.email, name: row.displayName || '',
        role: row.role, until: ymd(until)
      })
    });
    if(!res.ok) throw new Error(String(res.status));
    const r = await res.json().catch(() => ({}));
    /* Worker は Discord に出すところまでしかできない。
       本人へのメールは送信サービスが未契約のため mailed:false が返る。
       送ったことにすると取りこぼすので、そのまま伝える。 */
    if(r.mailed){
      msg.className = 'adnote';
      msg.textContent += '／お知らせのメールを送りました';
    }else{
      msg.className = 'adnote warn';
      msg.textContent += `／${row.email} あてにメールをお送りください（自動送信はまだ動いていません）`;
    }
  }catch(e){
    msg.className = 'adnote warn';
    msg.textContent += '／お知らせを出せませんでした。'
      + `${row.email} あてにメールをお送りください`;
  }
}
}
</script>
